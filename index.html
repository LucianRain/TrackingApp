<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b3a55">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 3rem;
    box-sizing: border-box;
  }
  #container {
    text-align: center;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #clock {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: 0.05em;
  }
  #date {
    font-size: 1.25rem;
    font-weight: 300;
    letter-spacing: 0.05em;
    margin-top: 0.5rem;
  }
</style>
</head>
<body>
  <div id="container">
    <div id="clock"></div>
    <div id="date"></div>
  </div>
  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clock").textContent = `${hours}:${minutes}`;
      document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      });
    }
    updateClock();
    setInterval(updateClock, 1000);

    const CYCLE_DURATION_MS = 30000;
    function updateBackground(timestamp) {
      const hue = ((timestamp % CYCLE_DURATION_MS) / CYCLE_DURATION_MS) * 360;
      document.body.style.backgroundColor = `hsl(${hue}, 35%, 25%)`;
      requestAnimationFrame(updateBackground);
    }
    requestAnimationFrame(updateBackground);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").then((registration) => {
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            registration.update();
          }
        });
      });

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        location.reload();
      });
    }
  </script>
</body>
</html>
