<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b3a55">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 3rem;
    box-sizing: border-box;
  }
  #squares {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  #container {
    position: relative;
    z-index: 1;
    text-align: center;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #clock {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: 0.05em;
  }
  #date {
    font-size: 1.25rem;
    font-weight: 300;
    letter-spacing: 0.05em;
    margin-top: 0.5rem;
  }
</style>
</head>
<body>
  <canvas id="squares"></canvas>
  <div id="container">
    <div id="clock"></div>
    <div id="date"></div>
  </div>
  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clock").textContent = `${hours}:${minutes}`;
      document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      });
    }
    updateClock();
    setInterval(updateClock, 1000);

    const CYCLE_DURATION_MS = 30000;
    function updateBackground(timestamp) {
      const hue = ((timestamp % CYCLE_DURATION_MS) / CYCLE_DURATION_MS) * 360;
      document.body.style.backgroundColor = `hsl(${hue}, 35%, 25%)`;
      requestAnimationFrame(updateBackground);
    }
    requestAnimationFrame(updateBackground);

    const canvas = document.getElementById("squares");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const SQUARE_COUNT = 14;
    const squares = Array.from({ length: SQUARE_COUNT }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: 15 + Math.random() * 35,
      vx: (Math.random() - 0.5) * 0.6,
      vy: (Math.random() - 0.5) * 0.6,
      angle: Math.random() * 360,
      spin: (Math.random() - 0.5) * 0.6,
      opacity: 0.08 + Math.random() * 0.12,
    }));

    function wanderVelocity(square) {
      square.vx += (Math.random() - 0.5) * 0.05;
      square.vy += (Math.random() - 0.5) * 0.05;
      const speed = Math.hypot(square.vx, square.vy);
      const maxSpeed = 0.6;
      if (speed > maxSpeed) {
        square.vx = (square.vx / speed) * maxSpeed;
        square.vy = (square.vy / speed) * maxSpeed;
      }
    }

    function updateSquares() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";

      for (const square of squares) {
        wanderVelocity(square);
        square.x += square.vx;
        square.y += square.vy;
        square.angle += square.spin;

        if (square.x < -square.size) square.x = canvas.width + square.size;
        if (square.x > canvas.width + square.size) square.x = -square.size;
        if (square.y < -square.size) square.y = canvas.height + square.size;
        if (square.y > canvas.height + square.size) square.y = -square.size;

        ctx.save();
        ctx.globalAlpha = square.opacity;
        ctx.translate(square.x, square.y);
        ctx.rotate((square.angle * Math.PI) / 180);
        ctx.fillRect(-square.size / 2, -square.size / 2, square.size, square.size);
        ctx.restore();
      }

      requestAnimationFrame(updateSquares);
    }
    requestAnimationFrame(updateSquares);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").then((registration) => {
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            registration.update();
          }
        });
      });

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        location.reload();
      });
    }
  </script>
</body>
</html>
