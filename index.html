<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b3a55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="visualSettings.js"></script>
<style>
  :root {
    --font-main: "PT Sans", sans-serif;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 3rem;
    box-sizing: border-box;
    font-family: var(--font-main);
    transition: background-color 250ms ease;
  }
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  @keyframes pageFadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }
  @keyframes cardIn {
    from {
      opacity: 0;
      transform: translateY(8px) scale(0.97);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }
  @keyframes countPulse {
    0% {
      transform: scale(1);
    }
    40% {
      transform: scale(1.3);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes eventCardIn {
    from {
      opacity: 0;
      transform: translate(-50%, calc(-50% - 40px));
    }
    to {
      opacity: 1;
      transform: translate(-50%, -50%);
    }
  }
  #squares {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: calc(100% - var(--tab-bar-height));
    z-index: 0;
  }
  #divider {
    position: fixed;
    left: 0;
    right: 0;
    bottom: var(--tab-bar-height);
    height: 1px;
    background: rgba(255, 255, 255, 0.25);
    z-index: 2;
  }
  #container {
    position: relative;
    z-index: 1;
    text-align: center;
    color: #ffffff;
  }
  #clock {
    font-size: 4rem;
    font-weight: 400;
    letter-spacing: 0.05em;
  }
  #date {
    font-size: 1.25rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    margin-top: 0.5rem;
  }
  #tabs {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    height: var(--tab-bar-height);
    box-sizing: border-box;
    padding: 0 1.25rem;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: stretch;
  }
  .tabs-group {
    grid-column: 2;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    justify-content: center;
    gap: 0.5rem;
  }
  .tab {
    box-sizing: border-box;
    padding: 0 1.5rem;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-top: none;
    border-radius: 0 0 14px 14px;
    background: rgba(0, 0, 0, 0.35);
    color: #ffffff;
    font-family: var(--font-main);
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, transform 100ms ease;
  }
  .tab:active {
    transform: scale(0.94);
  }
  .tab.active {
    background: #ffffff;
    color: #14213d;
    border-color: #ffffff;
  }
  .page {
    display: none;
  }
  .page.active {
    display: block;
    animation: pageFadeIn 220ms ease-out;
  }
  #page-train.active {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: calc(100% - var(--tab-bar-height));
    box-sizing: border-box;
    padding: 2.5rem 1rem 1rem;
    display: flex;
    flex-direction: column;
    z-index: 1;
  }
  .direction-toggle {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    flex-shrink: 0;
  }
  .dir-btn {
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    font-family: var(--font-main);
    font-size: 0.85rem;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, transform 100ms ease;
  }
  .dir-btn:active {
    transform: scale(0.94);
  }
  .dir-btn.active {
    background: #ffffff;
    color: #14213d;
    border-color: #ffffff;
  }
  #stop-toggle {
    margin-left: auto;
  }
  .time-shift-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 4rem;
    margin-top: 0.75rem;
    flex-shrink: 0;
  }
  .time-shift-btn {
    width: 0;
    height: 0;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    opacity: 0.75;
    transition: opacity 150ms ease, transform 100ms ease;
  }
  .time-shift-btn:active {
    opacity: 1;
    transform: scale(0.9);
  }
  .time-shift-left {
    border-top: 25px solid transparent;
    border-bottom: 25px solid transparent;
    border-right: 38px solid rgba(255, 255, 255, 0.6);
  }
  .time-shift-right {
    border-top: 25px solid transparent;
    border-bottom: 25px solid transparent;
    border-left: 38px solid rgba(255, 255, 255, 0.6);
  }
  .time-control {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.75rem;
    flex-shrink: 0;
  }
  #time-slider {
    flex: 1;
    min-width: 0;
  }
  .time-label-wrap {
    position: relative;
    display: inline-block;
    min-width: 4.5rem;
    flex-shrink: 0;
  }
  #time-slider-label {
    display: block;
    color: #ffffff;
    font-family: var(--font-main);
    font-size: 0.85rem;
    text-align: right;
  }
  #time-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }
  .lock-toggle {
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    font-family: var(--font-main);
    font-size: 0.85rem;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
    transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, transform 100ms ease;
  }
  .lock-toggle:active {
    transform: scale(0.94);
  }
  .lock-toggle.active {
    background: #ffffff;
    color: #14213d;
    border-color: #ffffff;
  }
  .trains-row {
    position: relative;
    flex: 1;
    display: flex;
    align-items: stretch;
    justify-content: space-evenly;
    gap: 0.75rem;
    overflow: hidden;
    min-height: 0;
  }
  .favorites-panel {
    display: none;
    flex-direction: column;
    gap: 0.5rem;
    width: 100%;
    max-width: 320px;
    margin: 0.75rem auto 0;
    flex-shrink: 0;
  }
  .favorites-panel.visible {
    display: flex;
  }
  .favorite-row {
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, var(--event-border-opacity));
    background: rgba(255, 255, 255, var(--event-bg-opacity));
    -webkit-backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    color: #ffffff;
    font-family: var(--font-main);
    padding: 0.5rem 0.75rem;
    box-sizing: border-box;
  }
  .favorite-row-header {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    margin-bottom: 0.3rem;
  }
  .favorite-train-number {
    font-weight: 700;
    font-size: 1rem;
  }
  .favorite-direction {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.75;
  }
  .favorite-detail {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    padding: 0.1rem 0;
  }
  .favorite-detail span:first-child {
    opacity: 0.7;
  }
  .train-card {
    position: relative;
    z-index: 1;
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    animation: cardIn 220ms ease-out both;
  }
  .train-card.split {
    justify-content: flex-start;
  }
  .train-box.split-header {
    margin-bottom: 15px;
  }
  .split-connector {
    position: relative;
    height: 100px;
    flex-shrink: 0;
  }
  .train-box {
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, var(--event-border-opacity));
    background: rgba(255, 255, 255, var(--event-bg-opacity));
    -webkit-backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    color: #ffffff;
    font-family: var(--font-main);
    padding: 0.5rem;
    box-sizing: border-box;
    transition: background-color 200ms ease, border-color 200ms ease;
  }
  .train-box.full {
    flex: 1;
    overflow-y: auto;
  }
  .train-box.skip-red {
    background: rgba(220, 50, 50, 0.55);
  }
  .train-box.skip-blue {
    background: rgba(50, 110, 220, 0.55);
  }
  .train-card.departed .train-box {
    background: rgba(60, 60, 60, 0.65);
  }
  .train-card.imminent .train-box {
    border-color: #ff0000;
    border-width: 2px;
  }
  .train-status-label {
    text-align: center;
    font-size: 0.65rem;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.85;
    margin-bottom: 0.2rem;
    min-height: 1.6rem;
    line-height: 1.2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .train-card-header {
    text-align: center;
    padding: 0.3rem;
    border-radius: 12px;
    margin-bottom: 15px;
    flex-shrink: 0;
    min-height: 2.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .train-box.split-part .train-card-header {
    margin-bottom: 0;
  }
  .train-type-label {
    font-size: 0.65rem;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.85;
  }
  .train-number {
    font-size: 1.1rem;
    font-weight: 700;
  }
  .train-star {
    display: inline-block;
    margin-left: 0.4rem;
    font-size: 1rem;
    line-height: 1;
    color: rgba(255, 255, 255, 0.55);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 150ms ease, transform 100ms ease;
  }
  .train-star:active {
    transform: scale(0.85);
  }
  .train-star.starred {
    color: #ffd700;
  }
  .train-stop-row {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.15rem 0.3rem;
    font-size: 0.75rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }
  .train-stop-row:last-child {
    border-bottom: none;
  }
  .train-box.split-part .train-stop-row {
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
  }
  .train-box.split-part:not(.split-header) {
    min-height: 3.4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .split-arrow {
    position: absolute;
    left: 50%;
    top: 15px;
    bottom: 39px;
    width: 12px;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.18);
  }
  .split-arrow::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -24px;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 24px solid rgba(255, 255, 255, 0.18);
  }
  .split-duration {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: #ffffff;
    font-family: var(--font-main);
    font-size: 0.85rem;
    font-weight: 700;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
    white-space: nowrap;
  }
  .now-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 5px;
    background: rgba(70, 130, 230, 0.85);
    pointer-events: none;
    z-index: -1;
    transition: left 400ms ease-out;
  }
  .event-card {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    min-width: 220px;
    padding: 1rem 1.25rem 1.25rem;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, var(--event-border-opacity));
    background: rgba(255, 255, 255, var(--event-bg-opacity));
    box-sizing: border-box;
    -webkit-backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    animation: eventCardIn 260ms ease-out;
  }
  .event-label {
    color: #ffffff;
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 1rem;
  }
  .event-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
  }
  .event-btn {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    font-size: 1.5rem;
    font-family: var(--font-main);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 150ms ease, transform 100ms ease;
  }
  .event-btn:active {
    background: rgba(255, 255, 255, 0.25);
    transform: scale(0.88);
  }
  .event-count {
    color: #ffffff;
    font-size: 2rem;
    min-width: 2.5rem;
    text-align: center;
    font-variant-numeric: tabular-nums;
    display: inline-block;
  }
  .event-count.pulse {
    animation: countPulse 220ms ease-out;
  }
  #update-button {
    grid-column: 3;
    justify-self: end;
    align-self: center;
    padding: 0.6rem 1rem;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    font-family: var(--font-main);
    font-size: 0.85rem;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 150ms ease, transform 100ms ease;
  }
  #update-button:active {
    background: rgba(255, 255, 255, 0.25);
    transform: scale(0.94);
  }
</style>
</head>
<body>
  <canvas id="squares"></canvas>
  <div id="divider"></div>
  <div id="tabs">
    <div class="tabs-group">
      <button class="tab active" data-tab="events">Events</button>
      <button class="tab" data-tab="train">Train</button>
    </div>
    <button id="update-button">Update</button>
  </div>
  <div class="page active" id="page-events">
    <div id="container">
      <div id="clock"></div>
      <div id="date"></div>
    </div>
    <div class="event-card">
      <div class="event-label">Event</div>
      <div class="event-controls">
        <button class="event-btn" id="event-minus">−</button>
        <span class="event-count" id="event-count">0</span>
        <button class="event-btn" id="event-plus">+</button>
      </div>
    </div>
  </div>
  <div class="page" id="page-train">
    <div class="direction-toggle">
      <button class="dir-btn active" data-dir="northbound">Northbound</button>
      <button class="dir-btn" data-dir="southbound">Southbound</button>
      <button id="stop-toggle" class="lock-toggle active">Show Stops</button>
    </div>
    <div class="trains-row" id="trains-row"></div>
    <div class="favorites-panel" id="favorites-panel"></div>
    <div class="time-shift-row">
      <button id="time-back-btn" class="time-shift-btn time-shift-left" aria-label="Rewind 30 minutes"></button>
      <button id="time-forward-btn" class="time-shift-btn time-shift-right" aria-label="Advance 30 minutes"></button>
    </div>
    <div class="time-control">
      <input type="range" id="time-slider" min="330" max="1440" step="10" />
      <span class="time-label-wrap">
        <span id="time-slider-label"></span>
        <input type="time" id="time-input" step="600" />
      </span>
      <button id="lock-toggle" class="lock-toggle active">Live</button>
    </div>
  </div>
  <script>
    const settings = window.VisualSettings;
    const root = document.documentElement.style;
    root.setProperty("--event-blur", settings.eventCard.blurPx + "px");
    root.setProperty("--event-darken", settings.eventCard.darken);
    root.setProperty("--event-bg-opacity", settings.eventCard.backgroundOpacity);
    root.setProperty("--event-border-opacity", settings.eventCard.borderOpacity);
    root.setProperty("--tab-bar-height", settings.layout.tabBarHeight + "px");

    function setBackgroundForTab(tab) {
      const { hue, saturation, lightness } = settings.background[tab];
      document.body.style.backgroundColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    function updateClock() {
      const now = new Date();
      const hours24 = now.getHours();
      const period = hours24 >= 12 ? "PM" : "AM";
      const hours = String(hours24 % 12 || 12).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clock").textContent = `${hours}:${minutes} ${period}`;
      document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      });
    }
    updateClock();
    setInterval(updateClock, 1000);

    const canvas = document.getElementById("squares");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    let squaresRunning = true;
    let squaresFrameScheduled = false;

    function updateSquares(timestamp) {
      squaresFrameScheduled = false;
      const { cellSize, squareSize, speedX, speedY, opacity } = settings.grid;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.globalAlpha = opacity;

      const seconds = timestamp / 1000;
      const offsetX = ((seconds * speedX) % cellSize + cellSize) % cellSize;
      const offsetY = ((seconds * speedY) % cellSize + cellSize) % cellSize;

      for (let x = -cellSize + offsetX; x < canvas.width + cellSize; x += cellSize) {
        for (let y = -cellSize + offsetY; y < canvas.height + cellSize; y += cellSize) {
          ctx.fillRect(x, y, squareSize, squareSize);
        }
      }

      if (squaresRunning) {
        squaresFrameScheduled = true;
        requestAnimationFrame(updateSquares);
      }
    }

    function setSquaresRunning(running) {
      squaresRunning = running;
      if (running && !squaresFrameScheduled) {
        squaresFrameScheduled = true;
        requestAnimationFrame(updateSquares);
      }
    }

    setSquaresRunning(true);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").then((registration) => {
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            registration.update();
          }
        });
      });

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        location.reload();
      });
    }

    let eventCount = 0;
    const eventCountEl = document.getElementById("event-count");
    function pulseEventCount() {
      eventCountEl.classList.remove("pulse");
      void eventCountEl.offsetWidth;
      eventCountEl.classList.add("pulse");
    }
    document.getElementById("event-plus").addEventListener("click", () => {
      eventCount += 1;
      eventCountEl.textContent = eventCount;
      pulseEventCount();
    });
    document.getElementById("event-minus").addEventListener("click", () => {
      eventCount -= 1;
      eventCountEl.textContent = eventCount;
      pulseEventCount();
    });

    const NORTHBOUND_STATIONS = [
      "San Jose Diridon", "College Park", "Santa Clara", "Lawrence", "Sunnyvale",
      "Mountain View", "San Antonio", "California Avenue", "Palo Alto", "Menlo Park",
      "Redwood City", "San Carlos", "Belmont", "Hillsdale", "Hayward Park", "San Mateo",
      "Burlingame", "Millbrae", "San Bruno", "S. San Francisco", "Bayshore",
      "22nd Street", "San Francisco",
    ];
    const SOUTHBOUND_STATIONS = [...NORTHBOUND_STATIONS].reverse();

    let trainSchedule = null;
    let currentDirection = "northbound";
    const trainsRowEl = document.getElementById("trains-row");
    const favoritesPanelEl = document.getElementById("favorites-panel");
    const nowLineEl = document.createElement("div");
    nowLineEl.id = "now-line";
    nowLineEl.className = "now-line";
    const dirButtons = document.querySelectorAll(".dir-btn");

    let stopsHidden = true;
    const stopToggleEl = document.getElementById("stop-toggle");

    stopToggleEl.addEventListener("click", () => {
      stopsHidden = !stopsHidden;
      stopToggleEl.classList.toggle("active", stopsHidden);
      stopToggleEl.textContent = stopsHidden ? "Show Stops" : "Hide Stops";
      renderSchedule(currentDirection);
    });

    const MAX_STARRED_TRAINS = 3;
    const STARRED_STORAGE_KEY = "starredTrains";

    function loadStarredTrains() {
      try {
        const stored = JSON.parse(localStorage.getItem(STARRED_STORAGE_KEY));
        if (Array.isArray(stored)) return stored.filter((k) => typeof k === "string").slice(-MAX_STARRED_TRAINS);
      } catch (e) {}
      return [];
    }

    function saveStarredTrains() {
      try {
        localStorage.setItem(STARRED_STORAGE_KEY, JSON.stringify(starredTrains));
      } catch (e) {}
    }

    let starredTrains = loadStarredTrains();

    function updateStarElement(key) {
      const isStarred = starredTrains.includes(key);
      trainsRowEl.querySelectorAll(`.train-star[data-train-key="${key}"]`).forEach((el) => {
        el.classList.toggle("starred", isStarred);
        el.textContent = isStarred ? "★" : "☆";
      });
    }

    function toggleStar(key) {
      const idx = starredTrains.indexOf(key);
      let evictedKey = null;
      if (idx !== -1) {
        starredTrains.splice(idx, 1);
      } else {
        starredTrains.push(key);
        if (starredTrains.length > MAX_STARRED_TRAINS) evictedKey = starredTrains.shift();
      }
      updateStarElement(key);
      if (evictedKey) updateStarElement(evictedKey);
      saveStarredTrains();
      renderFavoritesPanel();
    }

    function getFavoriteTrainInfo(key) {
      const sep = key.indexOf("-");
      const direction = key.slice(0, sep);
      const trainNum = key.slice(sep + 1);
      const trains = trainSchedule && trainSchedule[direction];
      const train = trains && trains.find((t) => t.train === trainNum);
      if (!train) return null;

      const leaveStop = train.stops[0];
      const arriveStop = train.stops[train.stops.length - 1];
      const leaveMinutes = timeToScheduleMinutes(leaveStop.time);
      const arriveMinutes = timeToScheduleMinutes(arriveStop.time);
      const duration = Math.abs(arriveMinutes - leaveMinutes);

      const nowReal = getRealNowMinutes();
      let statusLabel;
      let minsRemaining;
      if (nowReal < leaveMinutes) {
        statusLabel = "Departs in";
        minsRemaining = leaveMinutes - nowReal;
      } else if (nowReal < arriveMinutes) {
        statusLabel = "Arrives in";
        minsRemaining = arriveMinutes - nowReal;
      } else {
        statusLabel = "Departs in";
        minsRemaining = leaveMinutes + 24 * 60 - nowReal;
      }
      minsRemaining = Math.max(1, Math.ceil(minsRemaining));

      return {
        direction,
        trainNum,
        leaveLabel: minutesToLabel(leaveMinutes),
        arriveLabel: minutesToLabel(arriveMinutes),
        duration,
        statusLabel,
        statusValue: formatMinutesAway(minsRemaining),
      };
    }

    function renderFavoritesPanel() {
      const shouldShow = stopsHidden && starredTrains.length > 0;
      favoritesPanelEl.classList.toggle("visible", shouldShow);
      if (!shouldShow) {
        favoritesPanelEl.innerHTML = "";
        return;
      }
      favoritesPanelEl.innerHTML = starredTrains
        .map((key) => getFavoriteTrainInfo(key))
        .filter(Boolean)
        .map(
          (info) => `
            <div class="favorite-row">
              <div class="favorite-row-header">
                <span class="favorite-train-number">${info.trainNum}</span>
                <span class="favorite-direction">${info.direction === "northbound" ? "Northbound" : "Southbound"}</span>
              </div>
              <div class="favorite-detail"><span>Leaves</span><span>${info.leaveLabel}</span></div>
              <div class="favorite-detail"><span>Arrives</span><span>${info.arriveLabel}</span></div>
              <div class="favorite-detail"><span>Duration</span><span>${info.duration} min</span></div>
              <div class="favorite-detail"><span>${info.statusLabel}</span><span>${info.statusValue}</span></div>
            </div>
          `
        )
        .join("");
    }

    trainsRowEl.addEventListener("click", (e) => {
      const starEl = e.target.closest(".train-star");
      if (!starEl) return;
      e.stopPropagation();
      toggleStar(starEl.dataset.trainKey);
    });

    let lastVisibleEntries = [];
    let lastVisibleSignature = "";

    function entrySignature(entries) {
      return entries.map((e) => (e.wrapped ? "w" : "") + e.index).join(",");
    }

    function getVisibleEntries(trains) {
      const nowMinutes = getEffectiveMinutes();
      const departures = trains.map((t) => timeToScheduleMinutes(t.stops[0].time));
      let cutoffIndex = -1;
      for (let i = 0; i < departures.length; i++) {
        if (departures[i] <= nowMinutes) cutoffIndex = i;
        else break;
      }

      const entries = [];
      if (cutoffIndex >= 0) {
        entries.push({
          index: cutoffIndex,
          train: trains[cutoffIndex],
          wrapped: false,
          adjustedDeparture: departures[cutoffIndex],
        });
      }
      for (let k = 1; k <= UPCOMING_TRAIN_COUNT; k++) {
        const rawIndex = cutoffIndex + k;
        const wrapped = rawIndex >= trains.length;
        const index = ((rawIndex % trains.length) + trains.length) % trains.length;
        entries.push({
          index,
          train: trains[index],
          wrapped,
          adjustedDeparture: departures[index] + (wrapped ? 24 * 60 : 0),
        });
      }
      return entries;
    }

    const IMMINENT_THRESHOLD_MINUTES = 20;

    function formatMinutesAway(minsAway) {
      if (minsAway > 120) {
        const hoursAway = Math.round(minsAway / 60);
        return `${hoursAway}+ hours`;
      }
      return `${minsAway} min`;
    }

    function getStatusInfo(departureMinutes, nowMinutes) {
      if (departureMinutes <= nowMinutes) {
        return { text: "Departed", departed: true, imminent: false };
      }
      const minsAway = Math.max(1, Math.ceil(departureMinutes - nowMinutes));
      const imminent = minsAway <= IMMINENT_THRESHOLD_MINUTES;
      return { text: `Departing in ${formatMinutesAway(minsAway)}`, departed: false, imminent };
    }

    function updateStatusLabels() {
      if (!trainSchedule || !lastVisibleEntries.length) return;
      const cards = Array.from(trainsRowEl.querySelectorAll(".train-card"));
      const labels = Array.from(trainsRowEl.querySelectorAll(".train-status-label"));
      if (cards.length !== lastVisibleEntries.length || labels.length !== lastVisibleEntries.length) return;

      const nowMinutes = getEffectiveMinutes();
      lastVisibleEntries.forEach((entry, idx) => {
        const status = getStatusInfo(entry.adjustedDeparture, nowMinutes);
        labels[idx].textContent = status.text;
        cards[idx].classList.toggle("departed", status.departed);
        cards[idx].classList.toggle("imminent", status.imminent);
      });
    }

    function renderSchedule(direction) {
      if (!trainSchedule) return;
      currentDirection = direction;
      const trains = trainSchedule[direction];
      const stations = direction === "northbound" ? NORTHBOUND_STATIONS : SOUTHBOUND_STATIONS;

      const entries = getVisibleEntries(trains);
      lastVisibleEntries = entries;
      lastVisibleSignature = entrySignature(entries);
      const nowMinutes = getEffectiveMinutes();

      const html = entries
        .map(({ train, adjustedDeparture }, i) => {
          const skipCount = stations.length - train.stops.length;
          const skipClass = skipCount >= 12 ? "skip-red" : skipCount >= 7 ? "skip-blue" : "";
          const trainKey = `${direction}-${train.train}`;
          const isStarred = starredTrains.includes(trainKey);
          const starHtml = `<span class="train-star ${isStarred ? "starred" : ""}" data-train-key="${trainKey}">${isStarred ? "★" : "☆"}</span>`;
          const headerContent = skipClass
            ? `<div class="train-type-label">${train.type}</div><div class="train-number">${train.train}${starHtml}</div>`
            : `<div class="train-number">${train.train}${starHtml}</div>`;

          const status = getStatusInfo(adjustedDeparture, nowMinutes);
          const statusLabel = `<div class="train-status-label">${status.text}</div>`;
          const stateClass = `${status.departed ? "departed" : ""} ${status.imminent ? "imminent" : ""}`.trim();
          const cardStyle = `style="animation-delay: ${i * 40}ms"`;

          if (stopsHidden) {
            const sjStop = train.stops.find((s) => s.station === "San Jose Diridon");
            const sfStop = train.stops.find((s) => s.station === "San Francisco");
            const stopBox = (stop) =>
              `<div class="train-box split-part ${skipClass}"><div class="train-stop-row"><span>${stationLabel(stop.station)}</span><span>${stop.time}</span></div></div>`;
            const durationMinutes = Math.abs(
              timeToScheduleMinutes(sfStop.time) - timeToScheduleMinutes(sjStop.time)
            );
            return `<div class="train-card split ${stateClass}" ${cardStyle}>
              <div class="train-box split-part split-header ${skipClass}">${statusLabel}<div class="train-card-header">${headerContent}</div></div>
              ${stopBox(sjStop)}
              <div class="split-connector"><div class="split-arrow"></div><div class="split-duration">${durationMinutes} min</div></div>
              ${stopBox(sfStop)}
            </div>`;
          }

          const stopsHtml = train.stops
            .map((s) => `<div class="train-stop-row"><span>${stationLabel(s.station)}</span><span>${s.time}</span></div>`)
            .join("");
          return `<div class="train-card ${stateClass}" ${cardStyle}>
            <div class="train-box full ${skipClass}">
              ${statusLabel}
              <div class="train-card-header">${headerContent}</div>
              ${stopsHtml}
            </div>
          </div>`;
        })
        .join("");

      trainsRowEl.innerHTML = html;
      trainsRowEl.appendChild(nowLineEl);
      updateSliderDisplay();
      updateNowLine();
      renderFavoritesPanel();
    }

    const STATION_ABBREVIATIONS = {
      "San Jose Diridon": "Diridon",
      "San Francisco": "SF",
    };

    function stationLabel(station) {
      return STATION_ABBREVIATIONS[station] || station;
    }

    function timeToScheduleMinutes(timeStr) {
      const period = timeStr.slice(-1);
      let [h, m] = timeStr.slice(0, -1).split(":").map(Number);
      if (period === "a" && h === 12) h = 0;
      if (period === "p" && h !== 12) h += 12;
      let minutes = h * 60 + m;
      if (h < 4) minutes += 24 * 60;
      return minutes;
    }

    function getRealNowMinutes() {
      const now = new Date();
      let nowMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
      if (now.getHours() < 4) nowMinutes += 24 * 60;
      return nowMinutes;
    }

    const UPCOMING_TRAIN_COUNT = 3;
    let isLive = true;
    let previewMinutes = getRealNowMinutes();
    const timeSlider = document.getElementById("time-slider");
    const timeSliderLabel = document.getElementById("time-slider-label");
    const timeInput = document.getElementById("time-input");
    const lockToggle = document.getElementById("lock-toggle");

    function getEffectiveMinutes() {
      return isLive ? getRealNowMinutes() : previewMinutes;
    }

    function minutesToLabel(mins) {
      const m = ((mins % 1440) + 1440) % 1440;
      const h = Math.floor(m / 60);
      const mm = Math.floor(m % 60);
      const period = h >= 12 ? "PM" : "AM";
      let h12 = h % 12;
      if (h12 === 0) h12 = 12;
      return `${h12}:${String(mm).padStart(2, "0")} ${period}`;
    }

    function minutesToTimeInputValue(mins) {
      const m = ((mins % 1440) + 1440) % 1440;
      const h = Math.floor(m / 60);
      const mm = Math.floor(m % 60);
      return `${String(h).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
    }

    function updateSliderDisplay() {
      const mins = getEffectiveMinutes();
      timeSlider.value = mins;
      timeSliderLabel.textContent = minutesToLabel(mins);
      timeInput.value = minutesToTimeInputValue(mins);
    }

    function updateNowLine() {
      if (!trainSchedule || !lastVisibleEntries.length) return;
      const cards = Array.from(trainsRowEl.querySelectorAll(".train-card"));
      if (cards.length !== lastVisibleEntries.length) return;

      const nowMinutes = getEffectiveMinutes();
      const departures = lastVisibleEntries.map((e) => e.adjustedDeparture);
      const centers = cards.map((card) => card.offsetLeft + card.offsetWidth / 2);

      let lineX;
      if (nowMinutes <= departures[0]) {
        lineX = centers[0];
      } else if (nowMinutes >= departures[departures.length - 1]) {
        lineX = centers[centers.length - 1];
      } else {
        let i = 0;
        while (i < departures.length - 1 && departures[i + 1] <= nowMinutes) i++;
        const frac = (nowMinutes - departures[i]) / (departures[i + 1] - departures[i]);
        lineX = centers[i] + (centers[i + 1] - centers[i]) * frac;
      }
      nowLineEl.style.left = `${lineX}px`;
    }

    function tick() {
      updateSliderDisplay();
      if (!trainSchedule) return;
      const trains = trainSchedule[currentDirection];
      if (!trains.length) return;
      const entries = getVisibleEntries(trains);
      if (entrySignature(entries) !== lastVisibleSignature) {
        renderSchedule(currentDirection);
      } else {
        updateNowLine();
        updateStatusLabels();
      }
    }

    const SLIDER_MIN_MINUTES = 330;
    const SLIDER_MAX_MINUTES = 1440;
    const SLIDER_STEP_MINUTES = 10;

    function setLive(live) {
      isLive = live;
      lockToggle.classList.toggle("active", live);
      lockToggle.textContent = live ? "Live" : "Preview";
      timeSlider.disabled = live;
      timeSlider.style.display = live ? "none" : "";
      if (live) {
        previewMinutes = getRealNowMinutes();
      } else {
        const rounded = Math.round(getRealNowMinutes() / SLIDER_STEP_MINUTES) * SLIDER_STEP_MINUTES;
        previewMinutes = Math.min(SLIDER_MAX_MINUTES, Math.max(SLIDER_MIN_MINUTES, rounded));
      }
      tick();
    }

    lockToggle.addEventListener("click", () => setLive(!isLive));
    timeSlider.addEventListener("input", () => {
      if (isLive) return;
      previewMinutes = Number(timeSlider.value);
      tick();
    });

    function applyManualTime(rawMinutes) {
      const rounded = Math.round(rawMinutes / SLIDER_STEP_MINUTES) * SLIDER_STEP_MINUTES;
      const clamped = Math.min(SLIDER_MAX_MINUTES, Math.max(SLIDER_MIN_MINUTES, rounded));
      if (isLive) setLive(false);
      previewMinutes = clamped;
      tick();
    }

    timeInput.addEventListener("change", () => {
      if (!timeInput.value) return;
      const [h, m] = timeInput.value.split(":").map(Number);
      let minutes = h * 60 + m;
      if (minutes === 0) minutes = SLIDER_MAX_MINUTES;
      applyManualTime(minutes);
    });

    const timeBackBtn = document.getElementById("time-back-btn");
    const timeForwardBtn = document.getElementById("time-forward-btn");

    function shiftPreviewTime(deltaMinutes) {
      applyManualTime(getEffectiveMinutes() + deltaMinutes);
    }

    timeBackBtn.addEventListener("click", () => shiftPreviewTime(-30));
    timeForwardBtn.addEventListener("click", () => shiftPreviewTime(30));

    setLive(true);

    setInterval(() => {
      if (isLive) tick();
      renderFavoritesPanel();
    }, 1000);
    window.addEventListener("resize", updateNowLine);

    function getDefaultDirection() {
      return new Date().getHours() < 12 ? "northbound" : "southbound";
    }

    function setDirection(direction) {
      dirButtons.forEach((b) => b.classList.toggle("active", b.dataset.dir === direction));
      renderSchedule(direction);
    }

    fetch("trainSchedule.json")
      .then((res) => res.json())
      .then((data) => {
        trainSchedule = data;
        setDirection(getDefaultDirection());
      });

    dirButtons.forEach((button) => {
      button.addEventListener("click", () => setDirection(button.dataset.dir));
    });

    const TAB_STORAGE_KEY = "activeTab";
    const tabButtons = document.querySelectorAll(".tab");

    function selectTab(target) {
      tabButtons.forEach((b) => b.classList.toggle("active", b.dataset.tab === target));
      document.querySelectorAll(".page").forEach((page) => {
        page.classList.toggle("active", page.id === `page-${target}`);
      });
      setBackgroundForTab(target);
      setSquaresRunning(target !== "train");
      if (target === "train") {
        if (trainSchedule && getDefaultDirection() !== currentDirection) {
          setDirection(getDefaultDirection());
        } else {
          tick();
        }
      }
      try {
        localStorage.setItem(TAB_STORAGE_KEY, target);
      } catch (e) {}
    }

    tabButtons.forEach((button) => {
      button.addEventListener("click", () => selectTab(button.dataset.tab));
    });

    let initialTab = "events";
    try {
      const stored = localStorage.getItem(TAB_STORAGE_KEY);
      if (stored && document.getElementById(`page-${stored}`)) {
        initialTab = stored;
      }
    } catch (e) {}
    selectTab(initialTab);

    document.getElementById("update-button").addEventListener("click", async () => {
      if ("serviceWorker" in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }
      location.href = location.pathname + "?refresh=" + Date.now();
    });
  </script>
</body>
</html>
