<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b3a55">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 3rem;
    box-sizing: border-box;
  }
  #squares {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  #container {
    position: relative;
    z-index: 1;
    text-align: center;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #clock {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: 0.05em;
  }
  #date {
    font-size: 1.25rem;
    font-weight: 300;
    letter-spacing: 0.05em;
    margin-top: 0.5rem;
  }
  #update-button {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    z-index: 2;
    padding: 0.6rem 1rem;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.85rem;
    -webkit-tap-highlight-color: transparent;
  }
  #update-button:active {
    background: rgba(255, 255, 255, 0.25);
  }
</style>
</head>
<body>
  <canvas id="squares"></canvas>
  <div id="container">
    <div id="clock"></div>
    <div id="date"></div>
  </div>
  <button id="update-button">Update</button>
  <script>
    function updateClock() {
      const now = new Date();
      const hours24 = now.getHours();
      const period = hours24 >= 12 ? "PM" : "AM";
      const hours = String(hours24 % 12 || 12).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clock").textContent = `${hours}:${minutes} ${period}`;
      document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      });
    }
    updateClock();
    setInterval(updateClock, 1000);

    const CYCLE_DURATION_MS = 30000;
    function updateBackground(timestamp) {
      const hue = ((timestamp % CYCLE_DURATION_MS) / CYCLE_DURATION_MS) * 360;
      document.body.style.backgroundColor = `hsl(${hue}, 35%, 25%)`;
      requestAnimationFrame(updateBackground);
    }
    requestAnimationFrame(updateBackground);

    const canvas = document.getElementById("squares");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const CELL_SIZE = 60;
    const SQUARE_SIZE = 30;
    const GRID_SPEED_X = 6;
    const GRID_SPEED_Y = 4;

    function updateSquares(timestamp) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.globalAlpha = 0.12;

      const seconds = timestamp / 1000;
      const offsetX = ((seconds * GRID_SPEED_X) % CELL_SIZE + CELL_SIZE) % CELL_SIZE;
      const offsetY = ((seconds * GRID_SPEED_Y) % CELL_SIZE + CELL_SIZE) % CELL_SIZE;

      for (let x = -CELL_SIZE + offsetX; x < canvas.width + CELL_SIZE; x += CELL_SIZE) {
        for (let y = -CELL_SIZE + offsetY; y < canvas.height + CELL_SIZE; y += CELL_SIZE) {
          ctx.fillRect(x, y, SQUARE_SIZE, SQUARE_SIZE);
        }
      }

      requestAnimationFrame(updateSquares);
    }
    requestAnimationFrame(updateSquares);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").then((registration) => {
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            registration.update();
          }
        });
      });

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        location.reload();
      });
    }

    document.getElementById("update-button").addEventListener("click", async () => {
      if ("serviceWorker" in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }
      location.href = location.pathname + "?refresh=" + Date.now();
    });
  </script>
</body>
</html>
