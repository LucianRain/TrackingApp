<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b3a55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="visualSettings.js"></script>
<style>
  :root {
    --font-main: "PT Sans", sans-serif;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 3rem;
    box-sizing: border-box;
    font-family: var(--font-main);
  }
  #squares {
    position: fixed;
    left: var(--sidebar-width);
    top: 0;
    width: calc(100% - var(--sidebar-width));
    height: 100%;
    z-index: 0;
  }
  #divider {
    position: fixed;
    left: var(--sidebar-width);
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(255, 255, 255, 0.25);
    z-index: 2;
  }
  #container {
    position: relative;
    z-index: 1;
    text-align: center;
    color: #ffffff;
  }
  #clock {
    font-size: 4rem;
    font-weight: 400;
    letter-spacing: 0.05em;
  }
  #date {
    font-size: 1.25rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    margin-top: 0.5rem;
  }
  #tabs {
    position: fixed;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    width: var(--sidebar-width);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
  }
  .tab {
    width: 100%;
    box-sizing: border-box;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    padding: 0.9rem 0.5rem;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-left: none;
    border-radius: 0 14px 14px 0;
    background: rgba(0, 0, 0, 0.35);
    color: #ffffff;
    font-family: var(--font-main);
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active {
    background: #ffffff;
    color: #14213d;
    border-color: #ffffff;
  }
  .page {
    display: none;
  }
  .page.active {
    display: block;
  }
  #page-train.active {
    position: fixed;
    left: var(--sidebar-width);
    top: 0;
    width: calc(100% - var(--sidebar-width));
    height: 100%;
    box-sizing: border-box;
    padding: 2.5rem 1rem 1rem;
    display: flex;
    flex-direction: column;
    z-index: 1;
  }
  .direction-toggle {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    flex-shrink: 0;
  }
  .dir-btn {
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    font-family: var(--font-main);
    font-size: 0.85rem;
    -webkit-tap-highlight-color: transparent;
  }
  .dir-btn.active {
    background: #ffffff;
    color: #14213d;
    border-color: #ffffff;
  }
  .schedule-scroll {
    position: relative;
    flex: 1;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, var(--event-border-opacity));
    background: rgba(255, 255, 255, var(--event-bg-opacity));
    -webkit-backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
  }
  .schedule-table {
    border-collapse: collapse;
    color: #ffffff;
    font-family: var(--font-main);
    font-size: 0.8rem;
  }
  .schedule-table th,
  .schedule-table td {
    padding: 0.35rem 0.6rem;
    white-space: nowrap;
    text-align: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }
  .schedule-table thead th {
    font-weight: 700;
  }
  .now-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(255, 255, 255, 0.85);
    pointer-events: none;
    z-index: 3;
  }
  .schedule-table th:first-child,
  .schedule-table td:first-child {
    position: sticky;
    left: 0;
    text-align: left;
    background: rgba(255, 255, 255, var(--event-bg-opacity));
    -webkit-backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
  }
  .event-card {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    min-width: 220px;
    padding: 1rem 1.25rem 1.25rem;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, var(--event-border-opacity));
    background: rgba(255, 255, 255, var(--event-bg-opacity));
    box-sizing: border-box;
    -webkit-backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
  }
  .event-label {
    color: #ffffff;
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 1rem;
  }
  .event-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
  }
  .event-btn {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    font-size: 1.5rem;
    font-family: var(--font-main);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .event-btn:active {
    background: rgba(255, 255, 255, 0.25);
  }
  .event-count {
    color: #ffffff;
    font-size: 2rem;
    min-width: 2.5rem;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #update-button {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    z-index: 2;
    padding: 0.6rem 1rem;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    font-family: var(--font-main);
    font-size: 0.85rem;
    -webkit-tap-highlight-color: transparent;
  }
  #update-button:active {
    background: rgba(255, 255, 255, 0.25);
  }
</style>
</head>
<body>
  <canvas id="squares"></canvas>
  <div id="divider"></div>
  <div id="tabs">
    <button class="tab active" data-tab="events">Events</button>
    <button class="tab" data-tab="train">Train</button>
  </div>
  <div class="page active" id="page-events">
    <div id="container">
      <div id="clock"></div>
      <div id="date"></div>
    </div>
    <div class="event-card">
      <div class="event-label">Event</div>
      <div class="event-controls">
        <button class="event-btn" id="event-minus">−</button>
        <span class="event-count" id="event-count">0</span>
        <button class="event-btn" id="event-plus">+</button>
      </div>
    </div>
  </div>
  <div class="page" id="page-train">
    <div class="direction-toggle">
      <button class="dir-btn active" data-dir="northbound">Northbound</button>
      <button class="dir-btn" data-dir="southbound">Southbound</button>
    </div>
    <div class="schedule-scroll">
      <table class="schedule-table" id="schedule-table"></table>
      <div class="now-line" id="now-line"></div>
    </div>
  </div>
  <button id="update-button">Update</button>
  <script>
    const settings = window.VisualSettings;
    const root = document.documentElement.style;
    root.setProperty("--event-blur", settings.eventCard.blurPx + "px");
    root.setProperty("--event-darken", settings.eventCard.darken);
    root.setProperty("--event-bg-opacity", settings.eventCard.backgroundOpacity);
    root.setProperty("--event-border-opacity", settings.eventCard.borderOpacity);
    root.setProperty("--sidebar-width", settings.layout.sidebarWidth + "px");

    function setBackgroundForTab(tab) {
      const { hue, saturation, lightness } = settings.background[tab];
      document.body.style.backgroundColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    function updateClock() {
      const now = new Date();
      const hours24 = now.getHours();
      const period = hours24 >= 12 ? "PM" : "AM";
      const hours = String(hours24 % 12 || 12).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clock").textContent = `${hours}:${minutes} ${period}`;
      document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      });
    }
    updateClock();
    setInterval(updateClock, 1000);

    const canvas = document.getElementById("squares");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    let squaresRunning = true;
    let squaresFrameScheduled = false;

    function updateSquares(timestamp) {
      squaresFrameScheduled = false;
      const { cellSize, squareSize, speedX, speedY, opacity } = settings.grid;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.globalAlpha = opacity;

      const seconds = timestamp / 1000;
      const offsetX = ((seconds * speedX) % cellSize + cellSize) % cellSize;
      const offsetY = ((seconds * speedY) % cellSize + cellSize) % cellSize;

      for (let x = -cellSize + offsetX; x < canvas.width + cellSize; x += cellSize) {
        for (let y = -cellSize + offsetY; y < canvas.height + cellSize; y += cellSize) {
          ctx.fillRect(x, y, squareSize, squareSize);
        }
      }

      if (squaresRunning) {
        squaresFrameScheduled = true;
        requestAnimationFrame(updateSquares);
      }
    }

    function setSquaresRunning(running) {
      squaresRunning = running;
      if (running && !squaresFrameScheduled) {
        squaresFrameScheduled = true;
        requestAnimationFrame(updateSquares);
      }
    }

    setSquaresRunning(true);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").then((registration) => {
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            registration.update();
          }
        });
      });

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        location.reload();
      });
    }

    let eventCount = 0;
    const eventCountEl = document.getElementById("event-count");
    document.getElementById("event-plus").addEventListener("click", () => {
      eventCount += 1;
      eventCountEl.textContent = eventCount;
    });
    document.getElementById("event-minus").addEventListener("click", () => {
      eventCount -= 1;
      eventCountEl.textContent = eventCount;
    });

    const NORTHBOUND_STATIONS = [
      "San Jose Diridon", "College Park", "Santa Clara", "Lawrence", "Sunnyvale",
      "Mountain View", "San Antonio", "California Avenue", "Palo Alto", "Menlo Park",
      "Redwood City", "San Carlos", "Belmont", "Hillsdale", "Hayward Park", "San Mateo",
      "Burlingame", "Millbrae", "San Bruno", "S. San Francisco", "Bayshore",
      "22nd Street", "San Francisco",
    ];
    const SOUTHBOUND_STATIONS = [...NORTHBOUND_STATIONS].reverse();

    let trainSchedule = null;
    let currentDirection = "northbound";
    const scheduleTableEl = document.getElementById("schedule-table");
    const nowLineEl = document.getElementById("now-line");
    const dirButtons = document.querySelectorAll(".dir-btn");

    function renderSchedule(direction) {
      if (!trainSchedule) return;
      currentDirection = direction;
      const trains = trainSchedule[direction];
      const stations = direction === "northbound" ? NORTHBOUND_STATIONS : SOUTHBOUND_STATIONS;

      let html = "<thead><tr><th></th>";
      for (const train of trains) {
        html += `<th>${train.train}</th>`;
      }
      html += "</tr></thead><tbody>";

      for (const station of stations) {
        html += `<tr><th scope="row">${station}</th>`;
        for (const train of trains) {
          const stop = train.stops.find((s) => s.station === station);
          html += `<td>${stop ? stop.time : "–"}</td>`;
        }
        html += "</tr>";
      }
      html += "</tbody>";
      scheduleTableEl.innerHTML = html;
      updateNowLine();
    }

    function timeToScheduleMinutes(timeStr) {
      const period = timeStr.slice(-1);
      let [h, m] = timeStr.slice(0, -1).split(":").map(Number);
      if (period === "a" && h === 12) h = 0;
      if (period === "p" && h !== 12) h += 12;
      let minutes = h * 60 + m;
      if (h < 4) minutes += 24 * 60;
      return minutes;
    }

    function updateNowLine() {
      if (!trainSchedule) return;
      const trains = trainSchedule[currentDirection];
      const headerCells = Array.from(scheduleTableEl.querySelectorAll("thead th")).slice(1);
      if (!trains.length || headerCells.length !== trains.length) return;

      const now = new Date();
      let nowMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
      if (now.getHours() < 4) nowMinutes += 24 * 60;

      const departures = trains.map((t) => timeToScheduleMinutes(t.stops[0].time));
      const centers = headerCells.map((cell) => cell.offsetLeft + cell.offsetWidth / 2);

      let lineX;
      if (nowMinutes <= departures[0]) {
        lineX = centers[0];
      } else if (nowMinutes >= departures[departures.length - 1]) {
        lineX = centers[centers.length - 1];
      } else {
        let i = 0;
        while (i < departures.length - 1 && departures[i + 1] <= nowMinutes) i++;
        const frac = (nowMinutes - departures[i]) / (departures[i + 1] - departures[i]);
        lineX = centers[i] + (centers[i + 1] - centers[i]) * frac;
      }
      nowLineEl.style.left = `${lineX}px`;
    }

    setInterval(updateNowLine, 1000);
    window.addEventListener("resize", updateNowLine);

    fetch("trainSchedule.json")
      .then((res) => res.json())
      .then((data) => {
        trainSchedule = data;
        renderSchedule("northbound");
      });

    dirButtons.forEach((button) => {
      button.addEventListener("click", () => {
        dirButtons.forEach((b) => b.classList.toggle("active", b === button));
        renderSchedule(button.dataset.dir);
      });
    });

    const TAB_STORAGE_KEY = "activeTab";
    const tabButtons = document.querySelectorAll(".tab");

    function selectTab(target) {
      tabButtons.forEach((b) => b.classList.toggle("active", b.dataset.tab === target));
      document.querySelectorAll(".page").forEach((page) => {
        page.classList.toggle("active", page.id === `page-${target}`);
      });
      setBackgroundForTab(target);
      setSquaresRunning(target !== "train");
      if (target === "train") updateNowLine();
      try {
        localStorage.setItem(TAB_STORAGE_KEY, target);
      } catch (e) {}
    }

    tabButtons.forEach((button) => {
      button.addEventListener("click", () => selectTab(button.dataset.tab));
    });

    let initialTab = "events";
    try {
      const stored = localStorage.getItem(TAB_STORAGE_KEY);
      if (stored && document.getElementById(`page-${stored}`)) {
        initialTab = stored;
      }
    } catch (e) {}
    selectTab(initialTab);

    document.getElementById("update-button").addEventListener("click", async () => {
      if ("serviceWorker" in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }
      location.href = location.pathname + "?refresh=" + Date.now();
    });
  </script>
</body>
</html>
