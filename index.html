<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clock</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b110d">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
<script src="visualSettings.js?v=5"></script>
<style>
  :root {
    --font-main: "PT Sans", sans-serif;
    --font-display: "Quicksand", "PT Sans", sans-serif;
    color-scheme: dark;

    /* Plant palette: near-black soil, sage leaves, soft gold, dewdrop blue */
    --soil: #0b110d;
    --soil-raised: #121a15;
    --text: #e7eee4;
    --text-dim: rgba(231, 238, 228, 0.62);
    --leaf: #8fcb9b;
    --leaf-deep: #4f8a5e;
    --leaf-rgb: 143, 203, 155;
    --gold: #e2c26b;
    --gold-rgb: 226, 194, 107;
    --dew: #7fb6e3;

    --glass: rgba(var(--leaf-rgb), 0.045);
    --glass-strong: rgba(18, 28, 22, 0.72);
    --line: rgba(var(--leaf-rgb), 0.2);
    --line-strong: rgba(var(--leaf-rgb), 0.38);
    --pill-bg: rgba(var(--leaf-rgb), 0.07);
    --pill-bg-press: rgba(var(--leaf-rgb), 0.18);
  }
  html, body {
    margin: 0;
    touch-action: manipulation;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 3rem;
    box-sizing: border-box;
    font-family: var(--font-main);
    color: var(--text);
    background-color: var(--soil);
    background-image:
      radial-gradient(120% 60% at 50% -10%, rgba(var(--leaf-rgb), 0.09), transparent 60%),
      radial-gradient(80% 40% at 100% 100%, rgba(var(--gold-rgb), 0.05), transparent 60%);
    background-attachment: fixed;
    transition: background-color 250ms ease;
  }
  * {
    touch-action: manipulation;
  }
  ::selection {
    background: rgba(var(--leaf-rgb), 0.35);
  }
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  @keyframes pageFadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }
  @keyframes cardIn {
    from {
      opacity: 0;
      transform: translateY(8px) scale(0.97);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }
  @keyframes countPulse {
    0% {
      transform: scale(1);
    }
    40% {
      transform: scale(1.3);
    }
    100% {
      transform: scale(1);
    }
  }
  @keyframes eventCardIn {
    from {
      opacity: 0;
      transform: translateY(-40px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes imminentGlow {
    0%, 100% {
      box-shadow: 0 0 0 0 rgba(127, 182, 227, 0);
    }
    50% {
      box-shadow: 0 0 14px 0 rgba(127, 182, 227, 0.4);
    }
  }
  /* A tiny leaf used as a decorative bullet before titles */
  .leaf-mark::before,
  .event-label::before,
  .station-panel-title::before {
    content: "";
    display: inline-block;
    width: 0.5em;
    height: 0.5em;
    margin-right: 0.45em;
    vertical-align: 0.08em;
    border-radius: 0 70% 0 70%;
    background: linear-gradient(135deg, var(--leaf), var(--leaf-deep));
  }
  #squares {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }
  #container {
    position: relative;
    z-index: 1;
    text-align: center;
    color: var(--text);
  }
  #clock {
    font-family: var(--font-display);
    font-size: 4rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-shadow: 0 0 24px rgba(var(--leaf-rgb), 0.18);
  }
  #date {
    font-size: 1.25rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    margin-top: 0.5rem;
    color: var(--gold);
    opacity: 0.85;
  }
  /* Floating hamburger menu (bottom-right) holding the tabs and Update */
  .nav-menu {
    position: fixed;
    right: 1rem;
    bottom: calc(1rem + env(safe-area-inset-bottom));
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.6rem;
    pointer-events: none;
  }
  .nav-fab {
    pointer-events: auto;
    width: 3.25rem;
    height: 3.25rem;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: var(--glass-strong);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 100ms ease, border-color 150ms ease;
  }
  .nav-fab:active {
    transform: scale(0.92);
  }
  .nav-fab span {
    display: block;
    width: 20px;
    height: 2px;
    border-radius: 1px;
    background: var(--leaf);
    transition: transform 200ms ease, opacity 150ms ease;
  }
  .nav-menu.open .nav-fab {
    border-color: var(--leaf);
  }
  .nav-menu.open .nav-fab span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }
  .nav-menu.open .nav-fab span:nth-child(2) {
    opacity: 0;
  }
  .nav-menu.open .nav-fab span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }
  .nav-menu-panel {
    min-width: 9.5rem;
    padding: 0.4rem;
    border-radius: 16px;
    border: 1px solid var(--line-strong);
    background: var(--glass-strong);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    transform-origin: bottom right;
    transform: translateY(6px) scale(0.92);
    opacity: 0;
    visibility: hidden;
    transition: opacity 160ms ease, transform 160ms ease, visibility 0s linear 160ms;
  }
  .nav-menu.open .nav-menu-panel {
    transform: none;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity 160ms ease, transform 160ms ease, visibility 0s;
  }
  .nav-item {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 0.6rem 0.8rem;
    border: none;
    border-radius: 11px;
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-main);
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 150ms ease, color 150ms ease;
  }
  .nav-item:active {
    background: var(--pill-bg-press);
  }
  .nav-item.active {
    background: var(--leaf);
    color: var(--soil);
    font-weight: 700;
  }
  .nav-divider {
    height: 1px;
    margin: 0.2rem 0.4rem;
    background: var(--line);
  }
  #update-button.nav-item {
    color: var(--gold);
  }
  [hidden] {
    display: none !important;
  }
  .page {
    display: none;
  }
  .page.active {
    display: block;
    animation: pageFadeIn 220ms ease-out;
  }
  #page-train.active {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 2.5rem 1rem calc(5rem + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    z-index: 1;
  }
  .direction-toggle {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    flex-shrink: 0;
  }
  .dir-btn,
  .lock-toggle,
  .worktime-btn {
    border: 1px solid var(--line-strong);
    background: var(--pill-bg);
    color: var(--text);
  }
  .dir-btn {
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    font-family: var(--font-main);
    font-size: 0.85rem;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, transform 100ms ease;
  }
  .dir-btn:active {
    transform: scale(0.94);
  }
  .dir-btn.active {
    background: var(--leaf);
    color: var(--soil);
    border-color: var(--leaf);
    font-weight: 700;
  }
  #station-select-btn {
    margin-left: auto;
  }
  .lock-toggle.icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    width: 2.15rem;
    height: 2.15rem;
    align-self: center;
  }
  .lock-toggle.icon-btn svg {
    width: 1.15rem;
    height: 1.15rem;
  }
  .station-panel-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(4, 8, 6, 0.6);
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 1.5rem;
    box-sizing: border-box;
  }
  .station-panel-overlay.visible {
    display: flex;
  }
  .station-panel {
    width: 100%;
    max-width: 320px;
    border-radius: 16px;
    border: 1px solid var(--line-strong);
    background: var(--glass-strong);
    -webkit-backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    color: var(--text);
    font-family: var(--font-main);
    padding: 1rem;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .station-panel-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1rem;
  }
  .station-panel-row {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    font-size: 0.85rem;
  }
  .station-panel-row label {
    color: var(--text-dim);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .station-panel-row select {
    font-family: var(--font-main);
    font-size: 0.9rem;
    padding: 0.4rem 0.6rem;
    border-radius: 10px;
    border: 1px solid var(--line-strong);
    background: var(--soil-raised);
    color: var(--text);
    accent-color: var(--leaf);
  }
  .station-panel-row select:focus {
    outline: none;
    border-color: var(--leaf);
  }
  .station-panel-row select option {
    background: var(--soil-raised);
    color: var(--text);
  }
  .service-toggle {
    display: flex;
    gap: 0.5rem;
  }
  .service-toggle .dir-btn {
    flex: 1;
  }
  #station-panel-done {
    align-self: flex-end;
  }
  .lock-toggle {
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    font-family: var(--font-main);
    font-size: 0.85rem;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
    transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, transform 100ms ease;
  }
  .lock-toggle:active {
    transform: scale(0.94);
  }
  .lock-toggle.active {
    background: var(--leaf);
    color: var(--soil);
    border-color: var(--leaf);
    font-weight: 700;
  }
  .trains-viewport {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    margin: 0 -1rem;
  }
  .trains-row {
    position: relative;
    flex: 1;
    min-width: 0;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: calc((100% - 3 * 0.75rem) / 4);
    align-content: start;
    align-items: stretch;
    gap: 0.75rem;
    padding: 0 1rem;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .trains-row::-webkit-scrollbar {
    display: none;
  }
  .jump-now-btn {
    position: absolute;
    left: 50%;
    bottom: 0.5rem;
    z-index: 3;
    transform: translate(-50%, 8px);
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    transition: opacity 180ms ease, transform 180ms ease;
  }
  .jump-now-btn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
  }
  .jump-now-btn.visible:active {
    transform: translate(-50%, 0) scale(0.94);
  }
  .favorites-panel {
    display: none;
    flex-direction: column;
    gap: 0.5rem;
    width: 100%;
    max-width: 320px;
    margin: 0.75rem auto 0;
    flex-shrink: 0;
  }
  .favorites-panel.visible {
    display: flex;
  }
  .favorite-row {
    border-radius: 16px;
    border: 1px solid rgba(var(--gold-rgb), 0.3);
    background: linear-gradient(135deg, rgba(var(--gold-rgb), 0.07), var(--glass) 60%);
    -webkit-backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    color: var(--text);
    font-family: var(--font-main);
    padding: 0.5rem 0.75rem;
    box-sizing: border-box;
  }
  .favorite-row-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.3rem;
  }
  .favorite-row.collapsed .favorite-row-header {
    margin-bottom: 0;
  }
  .favorite-row .favorite-star {
    margin-left: auto;
    font-size: 1.4rem;
  }
  .favorite-train-number {
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .favorite-direction {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--leaf);
    opacity: 0.85;
  }
  .favorite-collapsed-times {
    font-size: 0.8rem;
    opacity: 0.85;
  }
  .favorite-detail-row {
    display: flex;
    align-items: baseline;
    padding: 0.15rem 0;
  }
  .favorite-detail {
    display: flex;
    align-items: baseline;
    gap: 0.3rem;
    font-size: 0.8rem;
    flex: 1;
    min-width: 0;
  }
  .favorite-detail-row .favorite-detail:first-child {
    padding-right: 0.6rem;
    border-right: 1px solid var(--line-strong);
  }
  .favorite-detail-row .favorite-detail:last-child {
    justify-content: flex-end;
    padding-left: 0.6rem;
  }
  .favorite-detail span:first-child {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .train-card {
    position: relative;
    z-index: 1;
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    animation: cardIn 220ms ease-out both;
  }
  .train-box {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: rgba(16, 25, 19, 0.86);
    color: var(--text);
    font-family: var(--font-main);
    padding: 0.5rem;
    box-sizing: border-box;
    transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease;
  }
  /* Express (skips the most stops): gold */
  .train-box.skip-red {
    background: linear-gradient(180deg, rgba(var(--gold-rgb), 0.3), rgba(var(--gold-rgb), 0.14));
    border-color: rgba(var(--gold-rgb), 0.55);
  }
  .train-box.skip-red .train-type-label {
    color: var(--gold);
    opacity: 1;
  }
  /* Limited: green */
  .train-box.skip-blue {
    background: linear-gradient(180deg, rgba(var(--leaf-rgb), 0.26), rgba(var(--leaf-rgb), 0.1));
    border-color: rgba(var(--leaf-rgb), 0.5);
  }
  .train-box.skip-blue .train-type-label {
    color: var(--leaf);
    opacity: 1;
  }
  .train-card.departed .train-box {
    background: rgba(14, 19, 16, 0.88);
    border-color: rgba(255, 255, 255, 0.07);
    color: rgba(231, 238, 228, 0.4);
  }
  .train-card.departed .train-type-label,
  .train-card.departed .train-connector-duration {
    color: inherit;
  }
  .train-card.imminent .train-box {
    border-color: var(--dew);
    border-width: 2px;
    animation: imminentGlow 2.4s ease-in-out infinite;
  }
  .train-card.imminent .train-status-label {
    color: var(--dew);
    opacity: 1;
  }
  .train-status-label {
    text-align: center;
    font-size: 0.65rem;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.85;
    line-height: 1.2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .train-card-header {
    text-align: center;
    padding: 0.3rem;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .train-type-label {
    font-size: 0.65rem;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }
  .train-number {
    font-size: 1.1rem;
    font-weight: 700;
  }
  .train-star {
    display: inline-block;
    margin-left: 0.4rem;
    font-size: 1rem;
    line-height: 1;
    color: rgba(var(--leaf-rgb), 0.4);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 150ms ease, transform 100ms ease, text-shadow 150ms ease;
  }
  .train-star:active {
    transform: scale(0.85);
  }
  .train-star.starred {
    color: var(--gold);
    text-shadow: 0 0 8px rgba(var(--gold-rgb), 0.45);
  }
  .train-stop-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
    padding: 0.3rem;
    font-size: 0.75rem;
  }
  .train-connector {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 2.75rem;
  }
  /* The connector reads as a little stem growing between stops */
  .train-connector-arrow {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 10px;
    width: 6px;
    border-radius: 3px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, rgba(var(--leaf-rgb), 0.08), rgba(var(--leaf-rgb), 0.3));
  }
  .train-connector-arrow::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -10px;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 10px solid rgba(var(--leaf-rgb), 0.3);
  }
  .train-connector-duration {
    position: relative;
    color: var(--text);
    font-family: var(--font-main);
    font-size: 0.85rem;
    font-weight: 700;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    white-space: nowrap;
  }
  .now-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 4px;
    border-radius: 2px;
    background: var(--leaf);
    box-shadow: 0 0 10px rgba(var(--leaf-rgb), 0.55);
    pointer-events: none;
    z-index: -1;
    transition: left 400ms ease-out;
  }
  .events-stack {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  .event-card {
    min-width: 220px;
    padding: 1rem 1.25rem 1.25rem;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--glass-strong);
    box-sizing: border-box;
    -webkit-backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    backdrop-filter: blur(var(--event-blur)) brightness(var(--event-darken));
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    animation: eventCardIn 260ms ease-out;
  }
  .event-label {
    color: var(--leaf);
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.9;
    margin-bottom: 1rem;
  }
  .event-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
  }
  .event-btn {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: var(--pill-bg);
    color: var(--leaf);
    font-size: 1.5rem;
    font-family: var(--font-main);

  <script>
    // Built-in defaults, overlaid by visualSettings.js section by section, so a
    // stale or partial settings file (e.g. an old cached copy) can't break startup.
    const DEFAULT_SETTINGS = {
      background: {
        events: { hue: 145, saturation: 20, lightness: 6 },
        train: { hue: 150, saturation: 16, lightness: 5 },
        home: { hue: 140, saturation: 18, lightness: 6 },
        finance: { hue: 135, saturation: 18, lightness: 6 },
      },
      leaves: { density: 8, minSize: 7, maxSize: 22, sprigChance: 0.2, speed: 5, sway: 18, opacity: 0.08, goldChance: 0.12 },
      eventCard: { blurPx: 5, darken: 0.9 },
    };
    const userSettings = window.VisualSettings || {};
    const settings = {
      background: {
        events: { ...DEFAULT_SETTINGS.background.events, ...(userSettings.background && userSettings.background.events) },
        train: { ...DEFAULT_SETTINGS.background.train, ...(userSettings.background && userSettings.background.train) },
        home: { ...DEFAULT_SETTINGS.background.home, ...(userSettings.background && userSettings.background.home) },
        finance: { ...DEFAULT_SETTINGS.background.finance, ...(userSettings.background && userSettings.background.finance) },
      },
      leaves: { ...DEFAULT_SETTINGS.leaves, ...userSettings.leaves },
      eventCard: { ...DEFAULT_SETTINGS.eventCard, ...userSettings.eventCard },
    };
    const root = document.documentElement.style;
    root.setProperty("--event-blur", settings.eventCard.blurPx + "px");
    root.setProperty("--event-darken", settings.eventCard.darken);

    function setBackgroundForTab(tab) {
      const { hue, saturation, lightness } = settings.background[tab] || settings.background.events;
      document.body.style.backgroundColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    function updateClock() {
      const now = new Date();
      const hours24 = now.getHours();
      const period = hours24 >= 12 ? "PM" : "AM";
      const hours = String(hours24 % 12 || 12).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clock").textContent = `${hours}:${minutes} ${period}`;
      document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      });
    }
    updateClock();
    setInterval(updateClock, 1000);

    const canvas = document.getElementById("squares");
    const ctx = canvas.getContext("2d");

    const LEAF_GREENS = ["#8fcb9b", "#74b585", "#5c9a6c", "#a9d6a8"];
    const LEAF_GOLD = "#e2c26b";
    let canvasWidth = 0;
    let canvasHeight = 0;
    let leaves = [];

    // Small deterministic RNG so the scatter looks the same between resizes.
    function mulberry32(seed) {
      return function () {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function buildLeaves() {
      const { density, minSize, maxSize, sprigChance, goldChance } = settings.leaves;
      const rand = mulberry32(20260928);
      const count = Math.round((canvasWidth * canvasHeight) / 100000 * density);
      leaves = [];
      for (let i = 0; i < count; i++) {
        // depth 0 = far (small, faint, slow), 1 = near (large, brighter, faster)
        const depth = rand();
        const isSprig = rand() < sprigChance;
        const baseSize = minSize + (maxSize - minSize) * (0.25 + 0.75 * depth) * (0.6 + 0.4 * rand());
        leaves.push({
          x: rand(),
          y: rand(),
          depth,
          isSprig,
          size: isSprig ? baseSize * 2.6 : baseSize,
          pairs: 2 + Math.floor(rand() * 3),
          bend: (rand() - 0.5) * 0.8,
          angle: rand() * Math.PI * 2,
          spin: (rand() - 0.5) * 0.12,
          swayPhase: rand() * Math.PI * 2,
          swayFreq: 0.15 + rand() * 0.25,
          color: rand() < goldChance ? LEAF_GOLD : LEAF_GREENS[Math.floor(rand() * LEAF_GREENS.length)],
        });
      }
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvasWidth = canvas.clientWidth;
      canvasHeight = canvas.clientHeight;
      canvas.width = Math.round(canvasWidth * dpr);
      canvas.height = Math.round(canvasHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildLeaves();
      if (!squaresRunning) requestAnimationFrame(updateSquares);
    }

    let squaresRunning = true;
    let squaresFrameScheduled = false;

    function leafPath(length, width) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(width, -length / 2, 0, -length);
      ctx.quadraticCurveTo(-width, -length / 2, 0, 0);
      ctx.fill();
    }

    function drawSprig(size, pairs, bend) {
      // Curved stem growing along -y with alternating leaves, smaller toward the tip.
      const tipX = bend * size;
      ctx.lineWidth = Math.max(1, size * 0.035);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(0, -size * 0.5, tipX, -size);
      ctx.stroke();
      for (let i = 0; i < pairs * 2; i++) {
        const t = (i + 1) / (pairs * 2 + 1);
        const px = t * t * tipX;
        const py = -size * t;
        const side = i % 2 === 0 ? 1 : -1;
        const leafLen = size * 0.34 * (1 - t * 0.45);
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(side * 0.95 + bend * 0.3);
        leafPath(leafLen, leafLen * 0.38);
        ctx.restore();
      }
      ctx.save();
      ctx.translate(tipX, -size);
      ctx.rotate(bend * 0.6);
      leafPath(size * 0.26, size * 0.1);
      ctx.restore();
    }

    function updateSquares(timestamp) {
      squaresFrameScheduled = false;
      const { speed, sway, opacity } = settings.leaves;
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      const seconds = timestamp / 1000;
      const margin = settings.leaves.maxSize * 3;
      const spanX = canvasWidth + margin * 2;
      const spanY = canvasHeight + margin * 2;

      for (const leaf of leaves) {
        const parallax = 0.4 + leaf.depth * 0.9;
        const swayOffset = Math.sin(seconds * leaf.swayFreq + leaf.swayPhase);
        // Drift gently down and to the right, wandering side to side as it falls.
        const travelX = seconds * speed * 0.55 * parallax + swayOffset * sway * parallax;
        const travelY = seconds * speed * parallax;
        const x = ((leaf.x * spanX + travelX) % spanX + spanX) % spanX - margin;
        const y = ((leaf.y * spanY + travelY) % spanY + spanY) % spanY - margin;
        const angle = leaf.angle + seconds * leaf.spin + swayOffset * 0.35;

        ctx.globalAlpha = opacity * (0.45 + leaf.depth * 0.75);
        ctx.fillStyle = leaf.color;
        ctx.strokeStyle = leaf.color;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        if (leaf.isSprig) {
          drawSprig(leaf.size, leaf.pairs, leaf.bend);
        } else {
          leafPath(leaf.size, leaf.size * 0.36);
        }
        ctx.restore();
      }

      if (squaresRunning) {
        squaresFrameScheduled = true;
        requestAnimationFrame(updateSquares);
      }
    }

    function setSquaresRunning(running) {
      squaresRunning = running;
      if (running && !squaresFrameScheduled) {
        squaresFrameScheduled = true;
        requestAnimationFrame(updateSquares);
      }
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    setSquaresRunning(true);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").then((registration) => {
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            registration.update();
          }
        });
      });

      // Only reload when a new worker replaces an existing one (a real update),
      // not when the very first worker takes control, which would load the page twice.
      let hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController) location.reload();
        hadController = true;
      });
    }

    let eventCount = 0;
    const eventCountEl = document.getElementById("event-count");
    function pulseEventCount() {
      eventCountEl.classList.remove("pulse");
      void eventCountEl.offsetWidth;
      eventCountEl.classList.add("pulse");
    }
    document.getElementById("event-plus").addEventListener("click", () => {
      eventCount += 1;
      eventCountEl.textContent = eventCount;
      pulseEventCount();
    });
    document.getElementById("event-minus").addEventListener("click", () => {
      eventCount -= 1;
      eventCountEl.textContent = eventCount;
      pulseEventCount();
    });

    const CLOCKIN_STORAGE_KEY = "worktime-clockin";
    const clockinInput = document.getElementById("clockin-input");
    const timeAtWorkRowEl = document.getElementById("time-at-work-row");
    const clockoutRowEl = document.getElementById("clockout-row");
    const timeAtWorkEl = document.getElementById("time-at-work");
    const clockoutTimeEl = document.getElementById("clockout-time");
    const clockoutBtnEl = document.getElementById("clockout-btn");

    function todayStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    }

    function formatClockTime(date) {
      const hours24 = date.getHours();
      const period = hours24 >= 12 ? "PM" : "AM";
      const hours = String(hours24 % 12 || 12).padStart(2, "0");
      const minutes = String(date.getMinutes()).padStart(2, "0");
      return `${hours}:${minutes} ${period}`;
    }

    let clockInDateStr = null;
    const storedRaw = localStorage.getItem(CLOCKIN_STORAGE_KEY);
    if (storedRaw) {
      try {
        const stored = JSON.parse(storedRaw);
        if (stored && /^\d{2}:\d{2}$/.test(stored.value) && stored.date === todayStr()) {
          clockinInput.value = stored.value;
          clockInDateStr = stored.date;
        } else {
          localStorage.removeItem(CLOCKIN_STORAGE_KEY);
        }
      } catch (e) {
        localStorage.removeItem(CLOCKIN_STORAGE_KEY);
      }
    }

    function resetClockIn() {
      clockinInput.value = "";
      clockInDateStr = null;
      localStorage.removeItem(CLOCKIN_STORAGE_KEY);
      updateWorktime();
    }

    function updateWorktime() {
      if (clockInDateStr && clockInDateStr !== todayStr()) {
        resetClockIn();
        return;
      }

      const match = /^(\d{2}):(\d{2})$/.exec(clockinInput.value);
      if (!match) {
        timeAtWorkRowEl.classList.add("hidden");
        clockoutRowEl.classList.add("hidden");
        return;
      }
      timeAtWorkRowEl.classList.remove("hidden");
      clockoutRowEl.classList.remove("hidden");

      const clockIn = new Date();
      clockIn.setHours(Number(match[1]), Number(match[2]), 0, 0);

      const now = new Date();
      const diffMinutes = Math.max(0, Math.floor((now - clockIn) / 60000));
      const diffHours = Math.floor(diffMinutes / 60);
      const remainderMinutes = diffMinutes % 60;
      timeAtWorkEl.textContent = `${diffHours}h ${remainderMinutes}m`;

      const clockOut = new Date(clockIn.getTime() + 8.5 * 60 * 60 * 1000);
      clockoutTimeEl.textContent = formatClockTime(clockOut);
    }

    clockinInput.addEventListener("change", () => {
      if (/^\d{2}:\d{2}$/.test(clockinInput.value)) {
        clockInDateStr = todayStr();
        localStorage.setItem(CLOCKIN_STORAGE_KEY, JSON.stringify({ value: clockinInput.value, date: clockInDateStr }));
      } else {
        clockInDateStr = null;
        localStorage.removeItem(CLOCKIN_STORAGE_KEY);
      }
      updateWorktime();
    });

    clockoutBtnEl.addEventListener("click", () => {
      resetClockIn();
    });

    updateWorktime();
    setInterval(updateWorktime, 1000);

    const NORTHBOUND_STATIONS = [
      "San Jose Diridon", "College Park", "Santa Clara", "Lawrence", "Sunnyvale",
      "Mountain View", "San Antonio", "California Avenue", "Palo Alto", "Menlo Park",
      "Redwood City", "San Carlos", "Belmont", "Hillsdale", "Hayward Park", "San Mateo",
      "Burlingame", "Millbrae", "San Bruno", "S. San Francisco", "Bayshore",
      "22nd Street", "San Francisco",
    ];
    const SOUTHBOUND_STATIONS = [...NORTHBOUND_STATIONS].reverse();

    let trainSchedule = null;
    let currentDirection = "northbound";
    const trainsRowEl = document.getElementById("trains-row");
    const favoritesPanelEl = document.getElementById("favorites-panel");
    const nowLineEl = document.createElement("div");
    nowLineEl.id = "now-line";
    nowLineEl.className = "now-line";
    const dirButtons = document.querySelectorAll(".direction-toggle .dir-btn");

    const STATION_PREFS_KEY = "stationPrefs";
    const DEFAULT_START_STATION = "San Jose Diridon";
    const DEFAULT_END_STATION = "San Francisco";

    function loadStationPrefs() {
      let start = DEFAULT_START_STATION;
      let end = DEFAULT_END_STATION;
      try {
        const stored = JSON.parse(localStorage.getItem(STATION_PREFS_KEY));
        if (stored && typeof stored === "object") {
          if (NORTHBOUND_STATIONS.includes(stored.start)) start = stored.start;
          if (NORTHBOUND_STATIONS.includes(stored.end)) end = stored.end;
        }
      } catch (e) {}
      return { start, end };
    }

    function saveStationPrefs() {
      try {
        localStorage.setItem(STATION_PREFS_KEY, JSON.stringify({ start: startStation, end: endStation }));
      } catch (e) {}
    }

    let { start: startStation, end: endStation } = loadStationPrefs();

    const stationPanelOverlay = document.getElementById("station-panel-overlay");
    const stationSelectBtn = document.getElementById("station-select-btn");
    const startStationSelect = document.getElementById("start-station-select");
    const endStationSelect = document.getElementById("end-station-select");
    const stationPanelDoneBtn = document.getElementById("station-panel-done");

    function populateStationSelects() {
      const optionsHtml = NORTHBOUND_STATIONS.map((s) => `<option value="${s}">${s}</option>`).join("");
      startStationSelect.innerHTML = optionsHtml;
      endStationSelect.innerHTML = optionsHtml;
      startStationSelect.value = startStation;
      endStationSelect.value = endStation;
    }

    populateStationSelects();

    stationSelectBtn.addEventListener("click", () => {
      populateStationSelects();
      stationPanelOverlay.classList.add("visible");
    });

    stationPanelOverlay.addEventListener("click", (e) => {
      if (e.target === stationPanelOverlay) stationPanelOverlay.classList.remove("visible");
    });

    stationPanelDoneBtn.addEventListener("click", () => {
      stationPanelOverlay.classList.remove("visible");
    });

    function applyStationSelection() {
      const newStart = startStationSelect.value;
      const newEnd = endStationSelect.value;
      if (newStart === newEnd) {
        startStationSelect.value = startStation;
        endStationSelect.value = endStation;
        return;
      }
      startStation = newStart;
      endStation = newEnd;
      saveStationPrefs();
      renderSchedule(currentDirection);
    }

    startStationSelect.addEventListener("change", applyStationSelection);
    endStationSelect.addEventListener("change", applyStationSelection);

    const SERVICE_OVERRIDE_KEY = "serviceOverride";
    const SERVICE_SCHEDULE_FILES = {
      weekday: "trainSchedule.json",
      weekend: "trainScheduleWeekend.json",
    };

    function dateKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function nthWeekdayOfMonth(year, month, weekday, n) {
      const firstWeekday = new Date(year, month, 1).getDay();
      const day = 1 + ((weekday - firstWeekday + 7) % 7) + (n - 1) * 7;
      return new Date(year, month, day);
    }

    function lastWeekdayOfMonth(year, month, weekday) {
      const last = new Date(year, month + 1, 0);
      const day = last.getDate() - ((last.getDay() - weekday + 7) % 7);
      return new Date(year, month, day);
    }

    function observedDate(date) {
      const day = date.getDay();
      if (day === 6) return new Date(date.getFullYear(), date.getMonth(), date.getDate() - 1);
      if (day === 0) return new Date(date.getFullYear(), date.getMonth(), date.getDate() + 1);
      return date;
    }

    function federalHolidayKeysForYear(year) {
      const fixedDates = [
        [0, 1], // New Year's Day
        [5, 19], // Juneteenth
        [6, 4], // Independence Day
        [10, 11], // Veterans Day
        [11, 25], // Christmas Day
      ].map(([month, day]) => observedDate(new Date(year, month, day)));

      const floatingDates = [
        nthWeekdayOfMonth(year, 0, 1, 3), // MLK Day: 3rd Monday of Jan
        nthWeekdayOfMonth(year, 1, 1, 3), // Presidents Day: 3rd Monday of Feb
        lastWeekdayOfMonth(year, 4, 1), // Memorial Day: last Monday of May
        nthWeekdayOfMonth(year, 8, 1, 1), // Labor Day: 1st Monday of Sep
        nthWeekdayOfMonth(year, 9, 1, 2), // Columbus Day: 2nd Monday of Oct
        nthWeekdayOfMonth(year, 10, 4, 4), // Thanksgiving: 4th Thursday of Nov
      ];

      return [...fixedDates, ...floatingDates].map(dateKey);
    }

    function autoServiceType(date = new Date()) {
      const day = date.getDay();
      if (day === 0 || day === 6) return "weekend";
      return federalHolidayKeysForYear(date.getFullYear()).includes(dateKey(date)) ? "weekend" : "weekday";
    }

    function loadServiceOverride() {
      try {
        const stored = JSON.parse(localStorage.getItem(SERVICE_OVERRIDE_KEY));
        if (stored && stored.date === todayStr() && (stored.value === "weekday" || stored.value === "weekend")) {
          return stored.value;
        }
      } catch (e) {}
      return null;
    }

    function saveServiceOverride(value) {
      try {
        localStorage.setItem(SERVICE_OVERRIDE_KEY, JSON.stringify({ value, date: todayStr() }));
      } catch (e) {}
    }

    function clearServiceOverride() {
      try {
        localStorage.removeItem(SERVICE_OVERRIDE_KEY);
      } catch (e) {}
    }

    let serviceDateStr = todayStr();
    let serviceType = loadServiceOverride() || autoServiceType();

    const serviceButtons = document.querySelectorAll(".service-btn");

    function updateServiceButtons() {
      serviceButtons.forEach((b) => b.classList.toggle("active", b.dataset.service === serviceType));
    }

    function loadSchedule(direction) {
      fetch(SERVICE_SCHEDULE_FILES[serviceType])
        .then((res) => res.json())
        .then((data) => {
          trainSchedule = data;
          setDirection(direction);
        });
    }

    function setServiceType(type) {
      if (type === serviceType) return;
      serviceType = type;
      saveServiceOverride(type);
      updateServiceButtons();
      loadSchedule(currentDirection);
    }

    function checkServiceDateRollover() {
      const today = todayStr();
      if (today === serviceDateStr) return;
      serviceDateStr = today;
      clearServiceOverride();
      const autoType = autoServiceType();
      const changed = autoType !== serviceType;
      serviceType = autoType;
      updateServiceButtons();
      if (changed) loadSchedule(currentDirection);
    }

    updateServiceButtons();
    serviceButtons.forEach((b) => b.addEventListener("click", () => setServiceType(b.dataset.service)));

    const MAX_STARRED_TRAINS = 3;
    const STARRED_STORAGE_KEY = "starredTrains";

    function emptyStarredState() {
      return { northbound: [], southbound: [] };
    }

    function directionOfKey(key) {
      return key.startsWith("northbound-") ? "northbound" : "southbound";
    }

    function loadStarredTrains() {
      const result = emptyStarredState();
      try {
        const stored = JSON.parse(localStorage.getItem(STARRED_STORAGE_KEY));
        if (Array.isArray(stored)) {
          // Migrate from the old single-list format.
          stored.forEach((key) => {
            if (typeof key === "string") result[directionOfKey(key)].push(key);
          });
        } else if (stored && typeof stored === "object") {
          ["northbound", "southbound"].forEach((dir) => {
            if (Array.isArray(stored[dir])) {
              result[dir] = stored[dir].filter((k) => typeof k === "string");
            }
          });
        }
      } catch (e) {}
      result.northbound = result.northbound.slice(-MAX_STARRED_TRAINS);
      result.southbound = result.southbound.slice(-MAX_STARRED_TRAINS);
      return result;
    }

    function saveStarredTrains() {
      try {
        localStorage.setItem(STARRED_STORAGE_KEY, JSON.stringify(starredTrains));
      } catch (e) {}
    }

    let starredTrains = loadStarredTrains();

    function updateStarElement(key) {
      const isStarred = starredTrains[directionOfKey(key)].includes(key);
      trainsRowEl.querySelectorAll(`.train-star[data-train-key="${key}"]`).forEach((el) => {
        el.classList.toggle("starred", isStarred);
        el.textContent = isStarred ? "★" : "☆";
      });
    }

    function toggleStar(key) {
      const list = starredTrains[directionOfKey(key)];
      const idx = list.indexOf(key);
      let evictedKey = null;
      if (idx !== -1) {
        list.splice(idx, 1);
      } else {
        list.push(key);
        if (list.length > MAX_STARRED_TRAINS) evictedKey = list.shift();
      }
      updateStarElement(key);
      if (evictedKey) updateStarElement(evictedKey);
      saveStarredTrains();
      renderFavoritesPanel();
    }

    function getFavoriteTrainInfo(key) {
      const sep = key.indexOf("-");
      const direction = key.slice(0, sep);
      const trainNum = key.slice(sep + 1);
      const trains = trainSchedule && trainSchedule[direction];
      const train = trains && trains.find((t) => t.train === trainNum);
      if (!train) return null;

      const leaveStop = train.stops[0];
      const arriveStop = train.stops[train.stops.length - 1];
      const leaveMinutes = timeToScheduleMinutes(leaveStop.time);
      const arriveMinutes = timeToScheduleMinutes(arriveStop.time);
      const duration = Math.abs(arriveMinutes - leaveMinutes);

      const nowReal = getRealNowMinutes();
      let statusLabel;
      let minsRemaining;
      if (nowReal < leaveMinutes) {
        statusLabel = "Departs in";
        minsRemaining = leaveMinutes - nowReal;
      } else if (nowReal < arriveMinutes) {
        statusLabel = "Arrives in";
        minsRemaining = arriveMinutes - nowReal;
      } else {
        statusLabel = "Departs in";
        minsRemaining = leaveMinutes + 24 * 60 - nowReal;
      }
      minsRemaining = Math.max(1, Math.ceil(minsRemaining));

      return {
        key,
        direction,
        trainNum,
        leaveLabel: minutesToLabel(leaveMinutes),
        arriveLabel: minutesToLabel(arriveMinutes),
        duration,
        statusLabel,
        statusValue: formatMinutesAway(minsRemaining),
      };
    }

    const collapsedFavorites = new Set();

    favoritesPanelEl.addEventListener("click", (e) => {
      const starEl = e.target.closest(".train-star");
      if (starEl) {
        e.stopPropagation();
        toggleStar(starEl.dataset.trainKey);
        return;
      }
      const nameEl = e.target.closest(".favorite-train-number");
      if (!nameEl) return;
      const key = nameEl.dataset.favoriteKey;
      if (collapsedFavorites.has(key)) {
        collapsedFavorites.delete(key);
      } else {
        collapsedFavorites.add(key);
      }
      renderFavoritesPanel();
    });

    // Last HTML written to the panel; this runs every second, and rebuilding
    // unchanged DOM can swallow a tap that lands mid-rebuild.
    let lastFavoritesHtml = null;
    function setFavoritesHtml(html) {
      if (html === lastFavoritesHtml) return;
      lastFavoritesHtml = html;
      favoritesPanelEl.innerHTML = html;
    }

    function renderFavoritesPanel() {
      const currentStars = starredTrains[currentDirection] || [];
      const shouldShow = currentStars.length > 0;
      favoritesPanelEl.classList.toggle("visible", shouldShow);
      if (!shouldShow) {
        setFavoritesHtml("");
        return;
      }
      setFavoritesHtml(currentStars
        .map((key) => getFavoriteTrainInfo(key))
        .filter(Boolean)
        .map((info) => {
          const isCollapsed = collapsedFavorites.has(info.key);
          if (isCollapsed) {
            return `
            <div class="favorite-row collapsed">
              <div class="favorite-row-header">
                <span class="favorite-train-number" data-favorite-key="${info.key}">${info.trainNum}</span>
                <span class="favorite-collapsed-times">${info.leaveLabel} → ${info.arriveLabel}</span>
                <span class="train-star starred favorite-star" data-train-key="${info.key}">★</span>
              </div>
            </div>`;
          }
          return `
            <div class="favorite-row">
              <div class="favorite-row-header">
                <span class="favorite-train-number" data-favorite-key="${info.key}">${info.trainNum}</span>
                <span class="favorite-direction">${info.direction === "northbound" ? "Northbound" : "Southbound"}</span>
                <span class="train-star starred favorite-star" data-train-key="${info.key}">★</span>
              </div>
              <div class="favorite-detail-row">
                <div class="favorite-detail"><span>Leaves</span><span>${info.leaveLabel}</span></div>
                <div class="favorite-detail"><span>Arrives</span><span>${info.arriveLabel}</span></div>
              </div>
              <div class="favorite-detail-row">
                <div class="favorite-detail"><span>Duration</span><span>${info.duration} min</span></div>
                <div class="favorite-detail"><span>${info.statusLabel}</span><span>${info.statusValue}</span></div>
              </div>
            </div>`;
        })
        .join(""));
    }

    trainsRowEl.addEventListener("click", (e) => {
      const starEl = e.target.closest(".train-star");
      if (!starEl) return;
      e.stopPropagation();
      toggleStar(starEl.dataset.trainKey);
    });

    let routeTrains = [];
    let routeDepartures = [];

    function getRouteTrains(direction) {
      return trainSchedule[direction].filter(
        (t) =>
          t.stops.some((s) => s.station === startStation) && t.stops.some((s) => s.station === endStation)
      );
    }

    // Departure time from whichever selected station the train reaches first.
    function originDepartureMinutes(train) {
      const startIdx = train.stops.findIndex((s) => s.station === startStation);
      const endIdx = train.stops.findIndex((s) => s.station === endStation);
      return timeToScheduleMinutes(train.stops[Math.min(startIdx, endIdx)].time);
    }

    function getLastDepartedIndex(nowMinutes) {
      let idx = -1;
      for (let i = 0; i < routeDepartures.length; i++) {
        if (routeDepartures[i] <= nowMinutes) idx = i;
        else break;
      }
      return idx;
    }

    const IMMINENT_THRESHOLD_MINUTES = 20;

    function formatMinutesAway(minsAway) {
      if (minsAway > 120) {
        const hoursAway = Math.round(minsAway / 60);
        return `${hoursAway}+ hours`;
      }
      return `${minsAway} min`;
    }

    function getStatusInfo(departureMinutes, nowMinutes) {
      if (departureMinutes <= nowMinutes) {
        return { text: "Departed", departed: true, imminent: false };
      }
      const minsAway = Math.max(1, Math.ceil(departureMinutes - nowMinutes));
      const imminent = minsAway <= IMMINENT_THRESHOLD_MINUTES;
      return { text: `Departing in ${formatMinutesAway(minsAway)}`, departed: false, imminent };
    }

    function updateStatusLabels() {
      const cards = trainsRowEl.querySelectorAll(".train-card");
      if (cards.length !== routeDepartures.length) return;
      const nowMinutes = getRealNowMinutes();
      cards.forEach((card, idx) => {
        const status = getStatusInfo(routeDepartures[idx], nowMinutes);
        const label = card.querySelector(".train-status-label");
        if (label.textContent !== status.text) label.textContent = status.text;
        card.classList.toggle("departed", status.departed);
        card.classList.toggle("imminent", status.imminent);
      });
    }

    function renderSchedule(direction) {
      if (!trainSchedule) return;
      currentDirection = direction;
      const stations = direction === "northbound" ? NORTHBOUND_STATIONS : SOUTHBOUND_STATIONS;
      const nowMinutes = getRealNowMinutes();

      const sorted = getRouteTrains(direction)
        .map((train) => ({ train, departure: originDepartureMinutes(train) }))
        .sort((a, b) => a.departure - b.departure);
      routeTrains = sorted.map((e) => e.train);
      routeDepartures = sorted.map((e) => e.departure);
      const anchorIndex = Math.max(0, getLastDepartedIndex(nowMinutes));

      const html = routeTrains
        .map((train, i) => {
          const skipCount = stations.length - train.stops.length;
          const skipClass = skipCount >= 12 ? "skip-red" : skipCount >= 7 ? "skip-blue" : "";
          const trainKey = `${direction}-${train.train}`;
          const isStarred = starredTrains[direction].includes(trainKey);
          const starHtml = `<span class="train-star ${isStarred ? "starred" : ""}" data-train-key="${trainKey}">${isStarred ? "★" : "☆"}</span>`;
          const headerContent = `<div class="train-type-label">${train.type}</div><div class="train-number">${train.train}${starHtml}</div>`;

          const status = getStatusInfo(routeDepartures[i], nowMinutes);
          const statusLabel = `<div class="train-status-label">${status.text}</div>`;
          const stateClass = `${status.departed ? "departed" : ""} ${status.imminent ? "imminent" : ""}`.trim();
          // Stagger the entrance only for the cards that start on screen.
          const cardStyle = `style="animation-delay: ${Math.min(Math.max(0, i - anchorIndex), 4) * 40}ms"`;

          const startStop = train.stops.find((s) => s.station === startStation);
          const endStop = train.stops.find((s) => s.station === endStation);
          const stopRow = (stop) =>
            `<div class="train-stop-row"><span>${stationLabel(stop.station)}</span><span>${stop.time}</span></div>`;
          const durationMinutes = Math.abs(
            timeToScheduleMinutes(endStop.time) - timeToScheduleMinutes(startStop.time)
          );
          const startIsFirst = train.stops.indexOf(startStop) < train.stops.indexOf(endStop);
          const topStop = startIsFirst ? startStop : endStop;
          const bottomStop = startIsFirst ? endStop : startStop;
          return `<div class="train-card ${stateClass}" ${cardStyle}>
            <div class="train-box ${skipClass}">
              ${statusLabel}
              <div class="train-card-header">${headerContent}</div>
              ${stopRow(topStop)}
              <div class="train-connector"><div class="train-connector-arrow"></div><div class="train-connector-duration">${durationMinutes} min</div></div>
              ${stopRow(bottomStop)}
            </div>
          </div>`;
        })
        .join("");

      trainsRowEl.innerHTML = html;
      trainsRowEl.appendChild(nowLineEl);
      lastAnchorIndex = getLastDepartedIndex(nowMinutes);
      updateNowLine();
      scrollToNow(false);
      renderFavoritesPanel();
    }

    const STATION_ABBREVIATIONS = {
      "San Jose Diridon": "Diridon",
      "San Francisco": "SF",
    };

    function stationLabel(station) {
      return STATION_ABBREVIATIONS[station] || station;
    }

    function timeToScheduleMinutes(timeStr) {
      const period = timeStr.slice(-1);
      let [h, m] = timeStr.slice(0, -1).split(":").map(Number);
      if (period === "a" && h === 12) h = 0;
      if (period === "p" && h !== 12) h += 12;
      let minutes = h * 60 + m;
      if (h < 4) minutes += 24 * 60;
      return minutes;
    }

    function getRealNowMinutes() {
      const now = new Date();
      let nowMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
      if (now.getHours() < 4) nowMinutes += 24 * 60;
      return nowMinutes;
    }

    function minutesToLabel(mins) {
      const m = ((mins % 1440) + 1440) % 1440;
      const h = Math.floor(m / 60);
      const mm = Math.floor(m % 60);
      const period = h >= 12 ? "PM" : "AM";
      let h12 = h % 12;
      if (h12 === 0) h12 = 12;
      return `${h12}:${String(mm).padStart(2, "0")} ${period}`;
    }

    function updateNowLine() {
      const cards = Array.from(trainsRowEl.querySelectorAll(".train-card"));
      if (!cards.length || cards.length !== routeDepartures.length) {
        nowLineEl.style.display = "none";
        return;
      }
      nowLineEl.style.display = "";

      const nowMinutes = getRealNowMinutes();
      const centers = cards.map((card) => card.offsetLeft + card.offsetWidth / 2);
      const halfStep =
        cards.length > 1 ? (cards[1].offsetLeft - cards[0].offsetLeft) / 2 : cards[0].offsetWidth / 2;
      const last = routeDepartures.length - 1;

      let lineX;
      if (nowMinutes < routeDepartures[0]) {
        lineX = Math.max(0, centers[0] - halfStep);
      } else if (nowMinutes >= routeDepartures[last]) {
        lineX = centers[last] + halfStep - nowLineEl.offsetWidth;
      } else {
        const i = getLastDepartedIndex(nowMinutes);
        const frac = (nowMinutes - routeDepartures[i]) / (routeDepartures[i + 1] - routeDepartures[i]);
        lineX = centers[i] + (centers[i + 1] - centers[i]) * frac;
      }
      nowLineEl.style.left = `${lineX}px`;
    }

    // --- Scrolling: the row follows "now" (last departed train first) until the user scrolls away.
    const jumpNowBtn = document.getElementById("jump-now-btn");
    let followNow = true;
    let lastAnchorIndex = -1;
    let lastUserInputAt = 0;
    let scrollIdleTimer = null;

    function getNowScrollLeft() {
      const cards = trainsRowEl.querySelectorAll(".train-card");
      if (!cards.length) return 0;
      const idx = Math.max(0, getLastDepartedIndex(getRealNowMinutes()));
      const maxScroll = trainsRowEl.scrollWidth - trainsRowEl.clientWidth;
      const padLeft = parseFloat(getComputedStyle(trainsRowEl).paddingLeft) || 0;
      return Math.max(0, Math.min(maxScroll, cards[idx].offsetLeft - padLeft));
    }

    function updateJumpNowButton() {
      jumpNowBtn.classList.toggle("visible", !followNow);
    }

    function scrollToNow(smooth) {
      trainsRowEl.scrollTo({ left: getNowScrollLeft(), behavior: smooth ? "smooth" : "auto" });
      followNow = true;
      updateJumpNowButton();
    }

    ["pointerdown", "touchstart", "wheel"].forEach((evt) => {
      trainsRowEl.addEventListener(evt, () => (lastUserInputAt = Date.now()), { passive: true });
    });

    trainsRowEl.addEventListener(
      "scroll",
      () => {
        clearTimeout(scrollIdleTimer);
        scrollIdleTimer = setTimeout(() => {
          if (Date.now() - lastUserInputAt > 5000) return;
          followNow = Math.abs(trainsRowEl.scrollLeft - getNowScrollLeft()) < 8;
          updateJumpNowButton();
        }, 150);
      },
      { passive: true }
    );

    jumpNowBtn.addEventListener("click", () => scrollToNow(true));

    function tick() {
      if (!trainSchedule || !routeDepartures.length) return;
      updateStatusLabels();
      updateNowLine();
      const anchor = getLastDepartedIndex(getRealNowMinutes());
      if (anchor !== lastAnchorIndex) {
        lastAnchorIndex = anchor;
        if (followNow && Date.now() - lastUserInputAt > 1500) scrollToNow(true);
      }
    }

    setInterval(() => {
      checkServiceDateRollover();
      tick();
      renderFavoritesPanel();
    }, 1000);
    window.addEventListener("resize", () => {
      updateNowLine();
      if (followNow) scrollToNow(false);
    });

    function resyncToDeviceTime() {
      checkServiceDateRollover();
      updateClock();
      updateWorktime();
      tick();
      scrollToNow(false);
      renderFavoritesPanel();
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") resyncToDeviceTime();
    });
    window.addEventListener("pageshow", resyncToDeviceTime);
    window.addEventListener("focus", resyncToDeviceTime);

    function getDefaultDirection() {
      return new Date().getHours() < 12 ? "northbound" : "southbound";
    }

    function setDirection(direction) {
      dirButtons.forEach((b) => b.classList.toggle("active", b.dataset.dir === direction));
      renderSchedule(direction);
    }

    loadSchedule(getDefaultDirection());

    dirButtons.forEach((button) => {
      button.addEventListener("click", () => setDirection(button.dataset.dir));
    });

    const TAB_STORAGE_KEY = "activeTab";
    const tabButtons = document.querySelectorAll(".tab");

    function selectTab(target) {
      tabButtons.forEach((b) => b.classList.toggle("active", b.dataset.tab === target));
      document.querySelectorAll(".page").forEach((page) => {
        page.classList.toggle("active", page.id === `page-${target}`);
      });
      setBackgroundForTab(target);
      setSquaresRunning(target !== "train");
      if (target === "train") {
        if (trainSchedule && getDefaultDirection() !== currentDirection) {
          setDirection(getDefaultDirection());
        } else {
          tick();
          scrollToNow(false);
        }
      }
      try {
        localStorage.setItem(TAB_STORAGE_KEY, target);
      } catch (e) {}
    }

    // Home tab: one button per command in actions.json. Each runs the ABApp
    // shortcut with the command name, and the shortcut does the actual work.
    const commandListEl = document.getElementById("command-list");

    function commandMessage(text) {
      const el = document.createElement("span");
      el.className = "worktime-key";
      el.textContent = text;
      commandListEl.replaceChildren(el);
    }

    async function loadCommands() {
      try {
        const res = await fetch("actions.json", { cache: "no-cache" });
        const commands = Object.entries(await res.json()).filter(([name]) => !name.startsWith("_"));
        if (!commands.length) return commandMessage("No commands yet");
        commandListEl.replaceChildren(
          ...commands.map(([name, command]) => {
            const row = document.createElement("div");
            row.className = "worktime-row command-row";
            const label = document.createElement("span");
            label.className = "worktime-key";
            label.textContent = command.label || name;
            const button = document.createElement("button");
            button.className = "worktime-btn";
            button.dataset.command = name;
            button.textContent = "Run";
            row.append(label, button);
            return row;
          })
        );
      } catch (e) {
        commandMessage("Couldn't load commands");
      }
    }

    commandListEl.addEventListener("click", (e) => {
      const button = e.target.closest("[data-command]");
      if (!button) return;
      location.href = `shortcuts://run-shortcut?name=ABApp&input=text&text=${encodeURIComponent(button.dataset.command)}`;
    });
    loadCommands();

    const navMenuEl = document.getElementById("nav-menu");
    const navToggleEl = document.getElementById("nav-toggle");

    function setNavMenuOpen(open) {
      navMenuEl.classList.toggle("open", open);
      navToggleEl.setAttribute("aria-expanded", String(open));
    }

    navToggleEl.addEventListener("click", (e) => {
      e.stopPropagation();
      setNavMenuOpen(!navMenuEl.classList.contains("open"));
    });
    document.addEventListener("click", (e) => {
      if (!navMenuEl.contains(e.target)) setNavMenuOpen(false);
    });

    tabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        selectTab(button.dataset.tab);
        setNavMenuOpen(false);
      });
    });

    let initialTab = "events";
    try {
      const stored = localStorage.getItem(TAB_STORAGE_KEY);
      if (stored && document.getElementById(`page-${stored}`)) {
        initialTab = stored;
      }
    } catch (e) {}
    selectTab(initialTab);

    document.getElementById("update-button").addEventListener("click", async () => {
      if ("serviceWorker" in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }
      location.href = location.pathname + "?refresh=" + Date.now();
    });
  </script>
</body>
</html>
